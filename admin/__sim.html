<!doctype html><meta charset="utf-8"><title>sim</title>
<link rel="stylesheet" href="/admin/styles.css" />
<div id="app" class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="view" id="view"></section>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="modal-root"></div>
<script type="module">
  const { renderSidebar } = await import("/admin/components.js");
  renderSidebar("dashboard", {});
  // Harness for scripts/sim — imports one admin module and renders it against
  // stub data, so a module that throws is visible without a real login.
  const SAMPLE = JSON.parse(document.getElementById("sample").textContent);
  const match = (rows, q) =>
    typeof q === "function" ? rows.filter(q)
      : q ? rows.filter((r) => Object.entries(q).every(([k, v]) => r[k] === v))
          : rows;
  const db = {
    list: (name, q) => match(SAMPLE[name] || [], q),
    get: (name, id) => (SAMPLE[name] || []).find((r) => r.id === id) || null,
    create: () => ({ id: "new" }), createAsync: async () => ({ id: "new" }),
    update: () => {}, updateAsync: async () => {}, remove: () => {},
    hydrate: async () => {}, onTable: () => () => {},
    exportAll: () => "{}", importAll: () => {}, wipe: () => {},
    fetchEvents: async () => [],
  };
  const ctx = {
    db, auth: {}, profile: { uid: "u1", email: "admin@brandmintstudios.in", role: "admin" },
    navigate() {}, toast() {}, refreshSidebar() {}, logout() {},
  };
  const name = new URLSearchParams(location.search).get("m");
  try {
    const mod = await import(`/admin/modules/${name}.js`);
    if (typeof mod.render !== "function") throw new Error("no render() export");
    const node = await mod.render(ctx);
    if (node) document.getElementById("view").appendChild(node);
    window.__simResult = { state: "ok", nodes: document.querySelectorAll("#view *").length };
  } catch (e) {
    window.__simResult = { state: "threw", message: String(e && e.message || e).split("\n")[0] };
  }
</script>
