<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Admin · Brand Mint</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/styles.css?v=fb3" />

    <!--
      Fast preflight. This is a UX optimisation, NOT the security check: it
      only avoids painting the dashboard shell for someone with no token at
      all. The real gate is requireRole('admin') in admin/app.js, and the
      actual boundary is firestore.rules — a forged localStorage entry buys
      you an empty dashboard, not the data.
    -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("bm.auth.profile.v1") || "null");
          if (p && p.id) return; // let app.js verify for real
        } catch (e) {}
        window.location.replace("/login?next=%2Fadmin.html");
      })();
    </script>
  </head>
  <body class="admin">
    <div id="boot" class="boot-screen">
      <div class="boot-inner">
        <div class="boot-mark" aria-hidden="true"><svg class="bm-mark" viewBox="0 0 64 64" width="34" height="34" aria-hidden="true" focusable="false"><defs><linearGradient id="bmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CF6C8"/><stop offset="1" stop-color="#10B981"/></linearGradient></defs><circle cx="32" cy="32" r="32" fill="url(#bmg)"/><path class="bm-mark-m" pathLength="100" d="M18 44V20l14 12 14-12v24" stroke="#0B1F1A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
        <p>Checking your access…</p>
      </div>
    </div>

    <div id="app" class="shell" hidden>
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main">
        <header class="topbar" id="topbar"></header>
        <section class="view" id="view">
          <div class="view-loading">Loading…</div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="modal-root"></div>

    <script type="module" src="/admin/app.js?v=fb2"></script>
  </body>
</html>
