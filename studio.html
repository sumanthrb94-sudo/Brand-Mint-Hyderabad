          <div class="bm-modal-scrim" data-close-outside>
            <form class="bm-modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
              <h3>${escapeHtml(title)}</h3>
              <p class="bm-modal-note">${note}</p>
              ${body}
              <p class="bm-status" id="bm-modal-status" hidden></p>
              <div class="bm-modal-foot">
                <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-close>Cancel</button>
                <button type="submit" class="bm-btn bm-btn--sm">${escapeHtml(submitLabel)}</button>
              </div>
            </form>
          </div>`;
        const form = $("bm-overlay").querySelector("form");
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const st = $("bm-modal-status");
          const btn = form.querySelector('button[type="submit"]');
          btn.disabled = true;
          try {
            await onSubmit(form);
            closeOverlay();
            await refresh();
          } catch (err) {
            st.hidden = false;
            st.className = "bm-status bm-status--error";
            st.textContent = err?.message || String(err);
            btn.disabled = false;
          }
        });
        mo.popIn(form, $("bm-overlay").querySelector(".bm-modal-scrim"));
        form.querySelector("input, select")?.focus();
      }

      /* The "New" menu and the create forms. Each one states the rule it is
         about to apply rather than applying it silently. */
      const NEW_FORMS = {
        org: () => modal({
          title: "Add a client",
          note: "Creates the organisation. The retainer starts as <strong>proposed</strong> and is not counted as revenue until you mark it signed — a number that flatters you is worse than no number.",
          submitLabel: "Add client",
          body: `
            <div class="bm-field"><label for="f-org-name">Business name</label>
              <input id="f-org-name" placeholder="Green Basket" required /></div>
            <div class="bm-field"><label for="f-org-kind">Kind</label>
              <select id="f-org-kind"><option value="client">Client</option><option value="internal">Internal</option></select></div>
            <div class="bm-field"><label for="f-org-retainer">Monthly retainer (Rs, 0 if none)</label>
              <input id="f-org-retainer" type="number" min="0" step="500" value="0" /></div>`,
          onSubmit: async () => {
            const name = $("f-org-name").value.trim();
            if (!name) throw new Error("Give the client a name.");
            await createOrg({
              name, kind: $("f-org-kind").value, status: "active",
              retainer: Number($("f-org-retainer").value) || 0, retainerStatus: "proposed",
            });
          },
        }),

        project: () => modal({
          title: "Add a project",
          note: "Progress stays unrecorded until there is an agreed scope to derive it from. A zero would draw an empty bar that reads as started-and-stalled.",
          submitLabel: "Add project",
          body: `
            <div class="bm-field"><label for="f-p-org">Client</label>
              <select id="f-p-org" required>${S.orgs.filter((o) => o.status === "active")
                .map((o) => `<option value="${escapeHtml(o.id)}">${escapeHtml(o.name)}</option>`).join("")
                || `<option value="">Add a client first</option>`}</select></div>
            <div class="bm-field"><label for="f-p-name">Project name</label>
              <input id="f-p-name" placeholder="Green Basket store" required /></div>
            <div class="bm-field"><label for="f-p-type">Type</label>
              <select id="f-p-type"><option value="">Not set</option>${SERVICE_TYPES
                .map((t) => `<option value="${escapeHtml(t.id)}">${escapeHtml(t.label)}</option>`).join("")}</select></div>
            <div class="bm-field"><label for="f-p-due">Due date (optional)</label>
              <input id="f-p-due" type="date" /></div>`,
          onSubmit: async () => {
            const orgId = $("f-p-org").value, name = $("f-p-name").value.trim();
            if (!orgId || !name) throw new Error("Pick a client and give the project a name.");
            await createProject({ orgId, name, type: $("f-p-type").value || null, dueAt: $("f-p-due").value || null, billable: true });
          },
        }),

        invoice: () => modal({
          title: "Raise an invoice",
          note: "Appears on the client's portal immediately, with a Pay button if online payment is switched on. Always created unpaid — money is counted when it arrives.",
          submitLabel: "Raise invoice",
          body: `
            <div class="bm-field"><label for="f-i-org">Client</label>
              <select id="f-i-org" required>${S.orgs.filter((o) => o.status === "active")
                .map((o) => `<option value="${escapeHtml(o.id)}">${escapeHtml(o.name)}</option>`).join("")
                || `<option value="">Add a client first</option>`}</select></div>
            <div class="bm-field"><label for="f-i-label">What it is for</label>
              <input id="f-i-label" placeholder="50% advance" required /></div>
            <div class="bm-field"><label for="f-i-amount">Amount (Rs)</label>
              <input id="f-i-amount" type="number" min="1" step="100" required /></div>
            <div class="bm-field"><label for="f-i-due">Due date (optional)</label>
              <input id="f-i-due" type="date" /></div>`,
          onSubmit: async () => {
            const orgId = $("f-i-org").value, label = $("f-i-label").value.trim();
            const amount = Number($("f-i-amount").value);
            if (!orgId || !label || !(amount > 0)) throw new Error("Pick a client, say what it is for, and give an amount above zero.");
            await createInvoice({ orgId, label, amount, dueAt: $("f-i-due").value || null });
          },
        }),

        lead: () => modal({
          title: "Add a lead",
          note: "The clock starts now. Log the first response the moment you send it — that timestamp is stamped once and never moves.",
          submitLabel: "Add lead",
          body: `
            <div class="bm-field"><label for="f-l-name">Name or company</label>
              <input id="f-l-name" required /></div>
            <div class="bm-field"><label for="f-l-source">Source</label>
              <select id="f-l-source">${LEAD_SOURCES.map((s) => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.label)}</option>`).join("")}</select></div>
            <div class="bm-field"><label for="f-l-stage">Stage</label>
              <select id="f-l-stage">${LEAD_STAGES.map((s) => `<option value="${escapeHtml(s.id)}" ${s.id === "inbound" ? "selected" : ""}>${escapeHtml(s.label)}</option>`).join("")}</select></div>`,
          onSubmit: async () => {
            const name = $("f-l-name").value.trim();
            if (!name) throw new Error("Give the lead a name.");
            await addLead({ name, source: $("f-l-source").value, stage: $("f-l-stage").value });
          },
        }),
      };

      $("bm-new").addEventListener("click", () => {
        const map = { clients: "org", delivery: "project", money: "invoice", pipeline: "lead" };
        (NEW_FORMS[map[S.view]] || NEW_FORMS.org)();
      });

      /* ── command palette ─────────────────────────────────────────
         Everything the CRM knows, in one list. On a screen with six sections
         the fastest route to a record is typing its name. */

      function commandPalette() {
        lastFocus = document.activeElement;
        $("bm-overlay").innerHTML = `
          <div class="bm-cmd-scrim" data-close-outside>
            <div class="bm-cmd" role="dialog" aria-modal="true" aria-label="Search">
              <input id="bm-cmd-input" placeholder="Search clients, projects, leads, invoices…" autocomplete="off" />
              <div class="bm-cmd-results" id="bm-cmd-results"></div>
            </div>
          </div>`;

        const items = [
          ...Object.entries(VIEW_META).map(([id, v]) => ({ kind: "Go to", label: v.title, run: () => renderView(id) })),
          ...S.orgs.map((o) => ({ kind: "Client", label: o.name || o.id, run: () => { renderView("clients"); openClient(o.id); } })),
          ...S.projects.map((p) => ({ kind: "Project", label: `${p.name || "Untitled"} — ${S.orgById[p.orgId]?.name || p.orgId}`, run: () => { renderView("delivery"); openProject(p.id); } })),
          ...S.leads.map((l) => ({ kind: "Lead", label: `${l.name || "Unnamed"} — ${STAGE_LABEL[l.stage] || l.stage}`, run: () => renderView("pipeline") })),
          ...S.invoices.map((i) => ({ kind: "Invoice", label: `${i.label || "Invoice"} — ${S.orgById[i.orgId]?.name || i.orgId} — ${formatINR(i.amount)}`, run: () => renderView("money") })),
        ];

        const input = $("bm-cmd-input");
        const results = $("bm-cmd-results");
        let cursor = 0, shown = [];

        function draw() {
          const q = input.value.trim().toLowerCase();
          shown = (q ? items.filter((i) => i.label.toLowerCase().includes(q) || i.kind.toLowerCase().includes(q)) : items).slice(0, 40);
          cursor = Math.min(cursor, Math.max(0, shown.length - 1));
          results.innerHTML = shown.length
            ? shown.map((i, n) => `<button type="button" class="bm-cmd-item" data-n="${n}" aria-selected="${n === cursor}">
                <span>${escapeHtml(i.label)}</span><span class="bm-cmd-kind">${escapeHtml(i.kind)}</span></button>`).join("")
            : `<p class="bm-cmd-empty">Nothing matches “${escapeHtml(input.value)}”.</p>`;
        }

        const pick = (n) => { const it = shown[n]; if (!it) return; closeOverlay(); it.run(); };

        input.addEventListener("input", draw);
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown") { e.preventDefault(); cursor = Math.min(cursor + 1, shown.length - 1); draw(); }
          else if (e.key === "ArrowUp") { e.preventDefault(); cursor = Math.max(cursor - 1, 0); draw(); }
          else if (e.key === "Enter") { e.preventDefault(); pick(cursor); }
        });
        results.addEventListener("click", (e) => {
          const b = e.target.closest("[data-n]");
          if (b) pick(Number(b.dataset.n));
        });

        draw();
        mo.popIn($("bm-overlay").querySelector(".bm-cmd"), $("bm-overlay").querySelector(".bm-cmd-scrim"));
        input.focus();
      }

      $("bm-search").addEventListener("click", commandPalette);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") return closeOverlay();
        const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable;
        if (typing) return;
        if (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) {
          e.preventDefault();
          commandPalette();
        }
      });

      /* ══════════════════════════════════════════════════════════
         ONE DELEGATED HANDLER
         Every action on this page routes through here. A page that attaches
         listeners to freshly rendered rows leaks one per render; this attaches
         two, once, for the whole CRM.
         ══════════════════════════════════════════════════════════ */

      document.addEventListener("click", async (e) => {
        const t = e.target;

        if (t.closest("[data-close]")) return closeOverlay();
        const outside = t.closest("[data-close-outside]");
        if (outside && t === outside) return closeOverlay();

        const goto = t.closest("[data-goto]");
        if (goto) { renderView(goto.dataset.goto); return; }

        const newBtn = t.closest("[data-new]");
        if (newBtn && NEW_FORMS[newBtn.dataset.new]) return NEW_FORMS[newBtn.dataset.new]();

        const org = t.closest("[data-org]");
        if (org && !t.closest("[data-org-save],[data-org-archive]")) return openClient(org.dataset.org);

        const proj = t.closest("[data-project]");
        if (proj) return openProject(proj.dataset.project);

        const btn = t.closest("button");
        if (!btn) return;
        const d = btn.dataset;

        try {
          /* --- leads --- */
          if (d.leadMove) {
            const l = S.leads.find((x) => x.id === d.leadMove);
            const order = LEAD_STAGES.filter((s) => s.id !== "lost");
            const i = order.findIndex((s) => s.id === l?.stage);
            const to = order[i + Number(d.dir)];
            if (!to) return;
            btn.disabled = true;
            await updateLead(d.leadMove, { stage: to.id, lossReason: null });
            return refresh();
          }
          if (d.leadRespond) {
            btn.disabled = true;
            const r = await markLeadFirstResponse(d.leadRespond);
            if (r && r.stamped === false) {
              alert("This lead already has a first response recorded. That date never moves — it is the number the whole funnel is measured against.");
            }
            return refresh();
          }
          if (d.leadLose) { btn.disabled = true; await updateLead(d.leadLose, { stage: "lost" }); return refresh(); }
          if (d.leadReopen) { btn.disabled = true; await updateLead(d.leadReopen, { stage: "inbound", lossReason: null }); return refresh(); }
          if (d.leadDel) {
            if (!confirm("Delete this lead? Its first-response time goes with it.")) return;
            await deleteLead(d.leadDel); return refresh();
          }

          /* --- organisations --- */
          if (d.orgSave) {
            const retainer = Number($("bm-d-retainer").value) || 0;
            const retainerStatus = $("bm-d-rstatus").value;
            btn.disabled = true;
            const was = S.orgById[d.orgSave] || {};
            await updateOrg(d.orgSave, { retainer, retainerStatus });
            // Logged because this is the single edit that moves MRR. Awaited,
            // but it cannot throw — see logActivity's contract.
            await logActivity("retainer.set",
              `${was.name || d.orgSave}: retainer ${formatINR(was.retainer || 0)} ${was.retainerStatus || "none"} → ${formatINR(retainer)} ${retainerStatus}`,
              { orgId: d.orgSave, target: was.name || d.orgSave, amount: retainer });
            closeOverlay();
            return refresh();
          }
          if (d.orgArchive) {
            const o = S.orgById[d.orgArchive];
            const to = o?.status === "archived" ? "active" : "archived";
            if (!confirm(to === "archived"
              ? "Archive this client? They stay in the database and stop counting towards MRR."
              : "Restore this client to active?")) return;
            await updateOrg(d.orgArchive, { status: to });
            await logActivity(to === "archived" ? "client.archive" : "client.restore",
              `${o?.name || d.orgArchive} ${to === "archived" ? "archived — stops counting towards MRR" : "restored to active"}`,
              { orgId: d.orgArchive, target: o?.name || d.orgArchive });
            closeOverlay();
            return refresh();
          }

          /* --- invoices --- */
          if (d.invPay) {
            if (!confirm("Mark this invoice paid? Do this only for cash or a bank transfer you have actually received — for online payments use Sync payments instead.")) return;
            btn.disabled = true;
            const inv = S.invoices.find((x) => x.id === d.invPay) || {};
            await updateInvoice(d.invPay, { status: "paid" });
            await logActivity("invoice.paid",
              `Marked paid BY HAND: ${inv.label || d.invPay} for ${S.orgById[inv.orgId]?.name || inv.orgId} — ${formatINR(inv.amount || 0)}`,
              { orgId: inv.orgId || null, target: inv.label || d.invPay, amount: Number(inv.amount) || null });
            return refresh();
          }
          if (d.invUnpay) {
            if (!confirm("Mark this invoice unpaid again?")) return;
            const uinv = S.invoices.find((x) => x.id === d.invUnpay) || {};
            await updateInvoice(d.invUnpay, { status: "due" });
            await logActivity("invoice.unpaid",
              `Reverted to unpaid: ${uinv.label || d.invUnpay} — ${formatINR(uinv.amount || 0)}`,
              { orgId: uinv.orgId || null, target: uinv.label || d.invUnpay, amount: Number(uinv.amount) || null });
            return refresh();
          }
          if (d.invDel) {
            if (!confirm("Delete this invoice? The client stops seeing it.")) return;
            const dinv = S.invoices.find((x) => x.id === d.invDel) || {};
            await deleteInvoice(d.invDel);
            await logActivity("invoice.delete",
              `Deleted invoice: ${dinv.label || d.invDel} — ${formatINR(dinv.amount || 0)}. The client stops seeing it.`,
              { orgId: dinv.orgId || null, target: dinv.label || d.invDel, amount: Number(dinv.amount) || null });
            return refresh();
          }

          /* --- project subcollections --- */
          const pid = d.pid;
          if (d.applyTemplate) {
            const start = $("bm-tpl-start")?.value;
            if (!start) return alert("Pick a start date first — the template dates are counted from it.");
            btn.disabled = true;
            const n = await applyMilestoneTemplate(d.applyTemplate, d.type, start);
            alert(`Added ${n} milestones. Edit or delete any that do not apply.`);
            closeOverlay(); return refresh();
          }
          if (d.scopeAdvance) {
            btn.disabled = true;
            const sp = S.projects.find((x) => x.id === d.pid);
            const line = (S.detail[d.pid]?.scope || []).find((l) => l.id === d.scopeAdvance);
            await setScopeLineStatus(d.pid, d.scopeAdvance, d.next);
            await logActivity("scope.advance",
              `${sp?.name || d.pid}: "${line?.label || d.scopeAdvance}" → ${d.next}`,
              { orgId: sp?.orgId || null, target: sp?.name || d.pid });
            await loadAll(); renderChrome(); renderView(S.view, { animate: false });
            return openProject(d.pid);
          }
          if (d.addMilestone) {
            const row = btn.closest('[data-add="milestone"]');
            const title = row.querySelector('[data-new="title"]').value.trim();
            if (!title) return;
            const dueVal = row.querySelector('[data-new="dueAt"]').value;
            await addMilestone(d.addMilestone, {
              title, owner: row.querySelector('[data-new="owner"]').value,
              status: "todo", dueAt: dueVal ? new Date(dueVal) : null,
            });
            await loadAll(); renderChrome(); return openProject(d.addMilestone);
          }
          if (d.addIntake) {
            const row = btn.closest('[data-add="intake"]');
            const label = row.querySelector('[data-new="label"]').value.trim();
            if (!label) return;
            await addIntakeItem(d.addIntake, { label, group: row.querySelector('[data-new="group"]').value });
            await loadAll(); renderChrome(); return openProject(d.addIntake);
          }
          if (d.addDeliverable) {
            const row = btn.closest('[data-add="deliverable"]');
            const title = row.querySelector('[data-new="title"]').value.trim();
            if (!title) return;
            const url = row.querySelector('[data-new="url"]').value.trim();
            await addDeliverable(d.addDeliverable, {
              title, version: row.querySelector('[data-new="version"]').value.trim(),
              url: safeUrl(url), status: "in_review",
            });
            await loadAll(); renderChrome(); return openProject(d.addDeliverable);
          }
          if (d.delMilestone) {
            if (!confirm("Delete this milestone?")) return;
            await deleteMilestone(pid, d.delMilestone);
            await loadAll(); renderChrome(); return openProject(pid);
          }
          if (d.delIntake) {
            if (!confirm("Delete this request? Its age — how long the client has been sitting on it — goes with it.")) return;
            await deleteIntakeItem(pid, d.delIntake);
            await loadAll(); renderChrome(); return openProject(pid);
          }
          if (d.delDeliverable) {
            if (!confirm("Delete this deliverable?")) return;
            await deleteDeliverable(pid, d.delDeliverable);
            await loadAll(); renderChrome(); return openProject(pid);
          }
          if (d.dedupe) {
            btn.disabled = true;
            const { removed, kept } = await dedupeIntake(d.dedupe);
            alert(removed
              ? `Removed ${removed} duplicate request${removed === 1 ? "" : "s"}. ${kept} remain, each with its original date.`
              : `No duplicates — all ${kept} are already unique.`);
            await loadAll(); renderChrome(); return openProject(d.dedupe);
          }
          if (d.delProject) {
            if (!confirm("Delete this project? Its milestones, requests, deliverables and agreed scope are not deleted with it and would be orphaned. This cannot be undone.")) return;
            const dp = S.projects.find((x) => x.id === d.delProject) || {};
            await deleteProject(d.delProject);
            await logActivity("project.delete",
              `Deleted project "${dp.name || d.delProject}" (${S.orgById[dp.orgId]?.name || dp.orgId}). Subcollections orphaned.`,
              { orgId: dp.orgId || null, target: dp.name || d.delProject });
            closeOverlay(); return refresh();
          }
        } catch (err) {
          alert("That did not work: " + (err?.message || err));
          await refresh();
        }
      });

      /* Field edits. Same delegation, on change rather than click. */
      document.addEventListener("change", async (e) => {
        const t = e.target;
        try {
          const lossSel = t.closest("[data-lossreason]");
          if (lossSel) { await updateLead(lossSel.dataset.lossreason, { lossReason: t.value || null }); return refresh(); }

          const pf = t.closest("[data-pfields]");
          if (pf) {
            const dueVal = pf.querySelector('[data-pfield="dueAt"]').value;
            await updateProject(pf.dataset.pfields, {
              name: pf.querySelector('[data-pfield="name"]').value.trim(),
              type: pf.querySelector('[data-pfield="type"]').value || null,
              dueAt: dueVal ? new Date(dueVal) : null,
              billable: pf.querySelector('[data-pfield="billable"]').checked,
            });
            await loadAll(); renderChrome(); renderView(S.view, { animate: false });
            return openProject(pf.dataset.pfields);
          }

          const read = (row, fields) => Object.fromEntries(fields.map((f) => {
            const el = row.querySelector(`[data-field="${f}"]`);
            return [f, !el ? undefined : el.type === "checkbox" ? el.checked : el.value];
          }));

          const ms = t.closest("[data-milestone]");
          if (ms) {
            const v = read(ms, ["title", "owner", "status", "dueAt"]);
            await updateMilestone(ms.dataset.pid, ms.dataset.milestone, { ...v, dueAt: v.dueAt ? new Date(v.dueAt) : null });
            await loadAll(); renderChrome(); return openProject(ms.dataset.pid);
          }

          const ik = t.closest("[data-intake]");
          if (ik) {
            const v = read(ik, ["label", "group", "done"]);
            await updateIntakeItem(ik.dataset.pid, ik.dataset.intake, { ...v, clearedAt: v.done ? new Date() : null });
            await loadAll(); renderChrome(); return openProject(ik.dataset.pid);
          }

          const dv = t.closest("[data-deliverable]");
          if (dv) {
            const v = read(dv, ["title", "version", "url", "status"]);
            await updateDeliverable(dv.dataset.pid, dv.dataset.deliverable, { ...v, url: safeUrl(v.url) });
            await loadAll(); renderChrome(); return openProject(dv.dataset.pid);
          }
        } catch (err) {
          alert("That did not save: " + (err?.message || err));
          await refresh();
        }
      });

      /* ══════════════════════════════════════════════════════════
         TOOLS
         ══════════════════════════════════════════════════════════ */

      $("bm-signout").addEventListener("click", async () => {
        await logout();
        window.location.href = "/login";
      });

      /* Razorpay is asked what it was actually paid; this browser — signed in
         as the admin, which firestore.rules already trusts to write invoices —
         does the writing. That is why no service account exists anywhere in
         this deployment.

         The report is deliberately verbose about what it did NOT do: a sync
         that silently changed nothing is indistinguishable from one that had
         nothing to change, and the difference matters when you are chasing a
         payment a client says they made. */
      $("bm-sync-payments").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        if (btn.disabled) return;
        btn.disabled = true;
        try {
          const r = await syncPayments(60);
          const lines = [
            r.updated.length
              ? `Marked ${r.updated.length} invoice${r.updated.length === 1 ? "" : "s"} paid:\n` +
                r.updated.map((u) => `  ${u.invoiceId} — ${formatINR(u.amount)} (${u.method || "?"})`).join("\n")
              : "No new payments to apply.",
          ];
          if (r.skipped.length) lines.push(`\nSkipped ${r.skipped.length}:\n` + r.skipped.map((s) => `  ${s.invoiceId} — ${s.why}`).join("\n"));
          if (r.unsettled.length) lines.push(`\n${r.unsettled.length} order${r.unsettled.length === 1 ? " was" : "s were"} started but never paid. Those are abandoned checkouts, not missing money.`);
          if (r.truncated) lines.push("\nWARNING: this sync was INCOMPLETE — too many orders in the window.");
          lines.push(`\n${r.note}`);
          alert(lines.join("\n"));
          /* One entry per invoice, not one per sync. The log is read to answer
             "when did this specific invoice get settled, and by what route" —
             a single "synced 3" line cannot answer that. */
          for (const u of r.updated) {
            await logActivity("invoice.paid.sync",
              `Reconciled from Razorpay: ${u.invoiceId} — ${formatINR(u.amount)} (${u.method || "method not reported"})`,
              { target: u.invoiceId, amount: Number(u.amount) || null });
          }
          if (r.updated.length) await refresh();
        } catch (err) {
          alert("Sync failed: " + paymentError(err));
        } finally {
          btn.disabled = false;
        }
      });

      $("bm-seed").addEventListener("click", async () => {
        if (!confirm(
          "This writes the fixed seed dataset — orgs, projects, invoices, the two confirmed " +
          "Green Basket deliverables, and your own admin user doc — with deterministic IDs. " +
          "Safe to re-run, but it overwrites those specific documents with the seed values " +
          "(so a client's approval on a seeded deliverable is reset to in_review, and any " +
          "project type/dueAt/progress you edited is reset). Leads and milestones you have " +
          "entered are never touched. Continue?"
        )) return;
        const btn = $("bm-seed");
        btn.disabled = true;
        try {
          await seedDatabase();
          await logActivity("db.seed", "Seed dataset written — seeded documents reset to their seed values.");
        } catch (err) { alert("Seeding failed: " + (err?.message || err)); }
        finally { btn.disabled = false; await refresh(); }
      });

      /* ── boot ────────────────────────────────────────────────── */

      (async function boot() {
        const user = await requireAdminAuth();
        if (!user) return;
        S.user = user;
        await loadAll();
        // Reveal only now: shell first, then main. See the fail-closed note
        // at the top of the body.
        $("bm-loading").hidden = true;
        $("bm-shell").hidden = false;
        $("bm-main").hidden = false;
        renderChrome();
        renderView(location.hash.slice(1) || "today");
        bindRunbookButtons();
      })();
    </script>
  </body>
</html>
