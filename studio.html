<!doctype html>
<html lang="en">

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"

    <script>
      // Before first paint — a module script is deferred and would flash.
      try { var t = localStorage.getItem("bm-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body class="bm-body">
    <!--
      THE STUDIO CRM
      ==============
      This screen replaced a single page that rendered fifteen panels and every
      project, expanded, at once. The report was "very complex, I'm unable to
      understand anything" and it was accurate: the page showed everything it
      knew, all the time, and left the reader to work out what mattered.

      The fix is the ordinary CRM shape and nothing cleverer: a list of records,
      and a detail view for the one you picked. Six sections down the left. One
      of them on screen at a time.

      WHAT IT DELIBERATELY DOES NOT DO
      --------------------------------
      No new Firestore collections and no new fields. Everything here is
      assembled from the six collections in CLAUDE.md §6, all of which
      `isAdmin()` already covers — so this ships with ZERO changes to
      firestore.rules. That is not a shortcut, it is the safe order: rules are
      published by hand from the Firebase Console (§2), so any UI that needed
      new rules would go live denied.

      §10's out-of-scope list still holds. There is no ticketing, no time
      tracking, no per-project profitability, no chat and no settings page here,
      because a CRM for one person that needs daily tending will rot inside a
      fortnight (§1).
    -->
    <!--
      FAIL CLOSED.
      The whole shell starts hidden and is only revealed once requireAdminAuth()
      has returned a real admin. Not a security boundary — firestore.rules is
      the only one of those — but the property tests/e2e.mjs asserts is that
      NOTHING renders to a signed-out visitor even when the guard cannot run at
      all (Firebase unreachable, script blocked). An earlier version of this
      rebuild hid only <main>, so the sidebar and topbar painted before the
      redirect. e2e caught it.
    -->
    <p id="bm-loading" class="bm-loading">Loading the studio…</p>

    <div class="bm-crm" id="bm-shell" hidden>

      <!-- ── sidebar ───────────────────────────────────────────── -->
      <aside class="bm-crm-side">
        <a class="bm-crm-logo" href="/studio">

        <p class="bm-crm-navlabel">Workspace</p>
        <nav class="bm-crm-nav" id="bm-nav" aria-label="Sections">
          <button type="button" data-view="today" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>
            Today

          <button type="button" data-view="pipeline">

            Pipeline<span class="bm-crm-count" id="bm-n-pipeline" hidden></span>
          </button>
          <button type="button" data-view="clients">

            Clients<span class="bm-crm-count" id="bm-n-clients" hidden></span>
          </button>
          <button type="button" data-view="delivery">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2.2"/></svg>
            Delivery<span class="bm-crm-count" id="bm-n-delivery" hidden></span>
          </button>
          <button type="button" data-view="money">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.4"/></svg>
            Money<span class="bm-crm-count" id="bm-n-money" hidden></span>
          </button>
          <button type="button" data-view="access">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10.5" width="16" height="9.5" rx="2.2"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/></svg>
            Access
          </button>
          <button type="button" data-view="activity">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg>
            Activity
          </button>
        </nav>

        <p class="bm-crm-navlabel">Tools</p>
        <nav class="bm-crm-nav" aria-label="Tools">
          <button type="button" onclick="location.href='/quote'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h4"/></svg>
            Scope &amp; quote
          </button>
          <button type="button" onclick="location.href='/services'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
            Service catalog
          </button>
          <button type="button" data-runbook="ops-add-client" data-runbook-label="Onboard a new client end to end">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg>
            Playbooks
          </button>
          <button type="button" id="bm-sync-payments">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-4M4 13a8 8 0 0 0 14 4"/><path d="M20 4v5h-5M4 20v-5h5"/></svg>
            Sync payments
          </button>
          <button type="button" onclick="location.href='/tenancy-check'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 5 6.5v5c0 4.3 2.9 8.1 7 9.2 4.1-1.1 7-4.9 7-9.2v-5Z"/><path d="m9.3 12 2 2 3.5-3.7"/></svg>
            Tenancy check
          </button>
          <button type="button" id="bm-seed">
            <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>
            Seed the database
          </button>
        </nav>

        <div class="bm-crm-side-foot">
          <p class="bm-crm-who" id="bm-who">—</p>
          <nav class="bm-crm-nav" aria-label="Account">
            <button type="button" id="bm-signout">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h9"/><path d="m18 15 3-3-3-3M21 12h-9"/></svg>
              Sign out
            </button>
          </nav>
        </div>
      </aside>

      <!-- ── topbar ────────────────────────────────────────────── -->
      <header class="bm-crm-top">
        <div class="bm-crm-crumb">
          <h1 id="bm-crumb">Today</h1>
          <p id="bm-crumb-sub"></p>
        </div>
        <div class="bm-crm-top-right">
          <button type="button" class="bm-crm-search" id="bm-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.7-3.7"/></svg>
            <span>Search everything</span>
            <kbd>/</kbd>
          </button>
          <button type="button" class="bm-btn bm-btn--sm" id="bm-new">New</button>
        </div>
      </header>

      <!-- ── workspace ─────────────────────────────────────────── -->
      <main class="bm-crm-main" id="bm-main" hidden>
        <section class="bm-view" id="view-today" hidden></section>
        <section class="bm-view" id="view-pipeline" hidden></section>
        <section class="bm-view" id="view-clients" hidden></section>
        <section class="bm-view" id="view-delivery" hidden></section>
        <section class="bm-view" id="view-money" hidden></section>
        <section class="bm-view" id="view-access" hidden></section>
        <section class="bm-view" id="view-activity" hidden></section>
      </main>
    </div>

    <!-- Overlay hosts. Empty until something opens; nothing is hidden in CSS
         waiting to be revealed. -->
    <div id="bm-overlay"></div>

    <script type="module">
      import {
        requireAdminAuth,
        getAllOrgs, getAllProjects, getAllInvoices, getAllLeads, getAllUsers,
        getMilestones, getIntake, getDeliverables, getScope,
        seedDatabase, setClientUser,
        addMilestone, updateMilestone, deleteMilestone,
        addIntakeItem, updateIntakeItem, deleteIntakeItem,
        addDeliverable, updateDeliverable, deleteDeliverable,
        addLead, updateLead, deleteLead, markLeadFirstResponse,
        createOrg, updateOrg, createProject, updateProject, deleteProject,
        createInvoice, updateInvoice, deleteInvoice,
        applyMilestoneTemplate, setScopeLineStatus, scopeProgress, scopeValue,
        dedupeIntake, resolveUsernameToEmail, logout,
        daysSince, formatDate, formatINR, formatDuration, minutesBetween, minutesSince,
        escapeHtml, safeUrl,
        BREAK_EVEN_MONTHLY, SERVICE_TYPES, MILESTONE_TEMPLATES,
        LEAD_STAGES, OPEN_LEAD_STAGES, FUNNEL_TARGETS, LEAD_SOURCES, LOSS_REASONS,
        FAST_RESPONSE_MINUTES, MARKET_MEDIAN_RESPONSE_HOURS,
        SCOPE_STATUS, SCOPE_STATUS_IDS,
        mountThemeToggle, syncPayments, paymentError,
        logActivity, getActivity,
      } from "/assets/bm-app.js";
      import { bindRunbookButtons } from "/assets/bm-runbooks.js";

      /* ── motion, optional by construction ────────────────────────
         Every call site goes through `mo`, which starts as a no-op object and
         is only replaced if the module actually loads. Someone who asked their
         OS for reduced motion never downloads it at all — that is a stronger
         answer than loading it and then animating less. */
      const NOOP = { view(){}, rows(){}, drawerIn(){}, drawerOut(){ return Promise.resolve(); },
                     popIn(){}, bar(){}, count(el, to, f){ if (el) el.textContent = f ? f(to) : String(to); }, tap(){} };
      let mo = NOOP;
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        import("/assets/bm-crm-motion.js").then((m) => { mo = m; }).catch(() => { /* stays NOOP */ });
      }

      mountThemeToggle(document.querySelector(".bm-crm-top-right"));

      /* ── state ───────────────────────────────────────────────────
         Loaded once per refresh and rendered from memory. The old page fetched
         every project's subcollections twice on every render — once for
         delivery health and again for the manage list. */
      const S = {
        user: null, orgs: [], projects: [], invoices: [], leads: [], users: [],
        orgById: {}, detail: {}, view: "today",
      };

      const GROUP_LABEL = { assets: "Assets", content: "Content", access: "Access", decisions: "Decisions" };
      const STAGE_LABEL = Object.fromEntries(LEAD_STAGES.map((s) => [s.id, s.label]));
      const SOURCE_LABEL = Object.fromEntries(LEAD_SOURCES.map((s) => [s.id, s.label]));
      const TYPE_LABEL = Object.fromEntries(SERVICE_TYPES.map((t) => [t.id, t.label]));

      const $ = (id) => document.getElementById(id);
      const inr = (n) => "Rs " + Math.round(n).toLocaleString("en-IN");
      const pct = (n) => `${Math.round(n * 100)}%`;
      const initials = (s) => String(s || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0] || "").join("");

      function ageTone(days) {
        if (days === null || days === undefined) return "bm-pill--muted";
        if (days <= 0) return "bm-pill--green";
        if (days <= 3) return "bm-pill--amber";
        return "bm-pill--red";
      }

      function dateInputValue(ts) {
        if (!ts) return "";
        const d = typeof ts.toDate === "function" ? ts.toDate() : new Date(ts);
        return Number.isNaN(d.getTime()) ? "" : d.toISOString().slice(0, 10);
      }

      const chev = `<svg class="bm-listrow-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`;

      /* ── loading ─────────────────────────────────────────────── */

      async function loadAll() {
        const [orgs, projects, invoices, leads, users] = await Promise.all([
          getAllOrgs(), getAllProjects(), getAllInvoices(), getAllLeads(), getAllUsers(),
        ]);
        S.orgs = orgs; S.projects = projects; S.invoices = invoices; S.leads = leads; S.users = users;
        S.orgById = Object.fromEntries(orgs.map((o) => [o.id, o]));

        // Every project's subcollections, once. Everything downstream — the
        // Today list, delivery health, the onboarding checklist, the project
        // drawer — reads from this.
        const detail = await Promise.all(projects.map(async (p) => {
          const [milestones, intake, deliverables, scope] = await Promise.all([
            getMilestones(p.id), getIntake(p.id), getDeliverables(p.id), getScope(p.id),
          ]);
          const open = intake.filter((i) => !i.done);
          const ages = open.map((i) => daysSince(i.raisedAt)).filter((d) => d !== null).sort((a, b) => b - a);
          const counts = new Map();
          intake.forEach((i) => {
            const k = String(i.label || "").trim().toLowerCase();
            counts.set(k, (counts.get(k) || 0) + 1);
          });
          const pending = milestones.filter((m) => m.status !== "done")
            .sort((a, b) => (a.dueAt?.toMillis?.() || 0) - (b.dueAt?.toMillis?.() || 0));
          return [p.id, {
            milestones, intake, deliverables, scope,
            openIntake: open.length,
            oldestOpenDays: ages.length ? ages[0] : null,
            duplicateIntake: [...counts.values()].filter((n) => n > 1).length,
            next: pending[0] || null,
            awaitingApproval: deliverables.filter((d) => d.status === "in_review").length,
          }];
        }));
        S.detail = Object.fromEntries(detail);
      }

      async function refresh() {
        await loadAll();
        renderChrome();
        renderView(S.view, { animate: false });
      }

      /* ── derived money facts ─────────────────────────────────────
         Signed retainers only. A proposal is not revenue (CLAUDE.md §4) and is
         never added into this figure anywhere on the page. */
      function money() {
        const signed = S.orgs.filter((o) => o.kind === "client" && o.status === "active" && o.retainerStatus === "signed");
        const mrr = signed.reduce((s, o) => s + (Number(o.retainer) || 0), 0);
        const inKind = signed.reduce((s, o) => s + (Number(o.retainerInKind) || 0), 0);
        const unpaid = S.invoices.filter((i) => i.status !== "paid");
        return {
          mrr, inKind, gap: BREAK_EVEN_MONTHLY - mrr,
          unpaid, unpaidTotal: unpaid.reduce((s, i) => s + (Number(i.amount) || 0), 0),
          paidTotal: S.invoices.filter((i) => i.status === "paid").reduce((s, i) => s + (Number(i.amount) || 0), 0),
        };
      }

      /* ── chrome ──────────────────────────────────────────────── */

      const VIEW_META = {
        today:    { title: "Today", sub: "What needs you, computed from your own data" },
        pipeline: { title: "Pipeline", sub: "Leads, first response, and the plan they are measured against" },
        clients:  { title: "Clients", sub: "Every organisation, and where each one stands" },
        delivery: { title: "Delivery", sub: "Projects, scope, blockers and approvals" },
        money:    { title: "Money", sub: "Retainers and the invoice ledger" },
        access:   { title: "Access", sub: "Who can sign in to a client portal" },
        activity: { title: "Activity", sub: "Append-only. Nobody can edit or delete an entry, including you." },
      };

      function renderChrome() {
        const m = money();
        const openLeads = S.leads.filter((l) => OPEN_LEAD_STAGES.includes(l.stage));
        const activeProjects = S.projects.filter((p) => S.orgById[p.orgId]?.status === "active");
        const counts = {
          "bm-n-pipeline": openLeads.length,
          "bm-n-clients": S.orgs.filter((o) => o.kind === "client" && o.status === "active").length,
          "bm-n-delivery": activeProjects.length,
          "bm-n-money": m.unpaid.length,
        };
        for (const [id, n] of Object.entries(counts)) {
          const el = $(id);
          if (!el) continue;
          el.textContent = String(n);
          el.hidden = n === 0;
        }
        $("bm-who").textContent = S.user?.email || "";
      }

      /* ── view switching ──────────────────────────────────────── */

      const RENDER = {};

      function renderView(name, { animate = true } = {}) {
        const view = VIEW_META[name] ? name : "today";
        S.view = view;

        for (const key of Object.keys(VIEW_META)) {
          const el = $(`view-${key}`);
          if (el) el.hidden = key !== view;
        }
        document.querySelectorAll("#bm-nav button").forEach((b) => {
          b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false");
        });

        $("bm-crumb").textContent = VIEW_META[view].title;
        $("bm-crumb-sub").textContent = VIEW_META[view].sub;

        RENDER[view]?.();

        if (location.hash.slice(1) !== view) history.replaceState(null, "", `#${view}`);
        if (animate) mo.view($(`view-${view}`));
      }

      $("bm-nav").addEventListener("click", (e) => {
        const b = e.target.closest("[data-view]");
        if (!b) return;
        mo.tap(b);
        renderView(b.dataset.view);
        $("bm-main").scrollIntoView({ block: "start", behavior: "instant" });
      });

      /* ══════════════════════════════════════════════════════════
         TODAY
         ══════════════════════════════════════════════════════════ */

      RENDER.today = () => {
        const m = money();
        const openLeads = S.leads.filter((l) => OPEN_LEAD_STAGES.includes(l.stage));
        const awaiting = openLeads.filter((l) => !l.firstResponseAt);
        const activeProjects = S.projects.filter((p) => S.orgById[p.orgId]?.status === "active");
        const facts = activeProjects.map((p) => ({
          id: p.id,
          name: p.name || S.orgById[p.orgId]?.name || p.orgId,
          ...S.detail[p.id],
        }));

        const hour = new Date().getHours();
        const greet = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";

        // Response median — "not recorded" is not the same as fast.
        const times = S.leads.map((l) => minutesBetween(l.createdAt, l.firstResponseAt))
          .filter((x) => x !== null).sort((a, b) => a - b);
        let responseText, responseTone, responseSub;
        if (!times.length) {
          responseText = S.leads.length ? "Not recorded" : "No leads yet";
          responseTone = "bm-tile-value--red";
          responseSub = S.leads.length ? `${awaiting.length} awaiting a first response`
                                       : `Market median is ~${MARKET_MEDIAN_RESPONSE_HOURS}h`;
        } else {
          const mid = Math.floor(times.length / 2);
          const median = times.length % 2 ? times[mid] : (times[mid - 1] + times[mid]) / 2;
          responseText = formatDuration(median);
          responseTone = median <= FAST_RESPONSE_MINUTES ? "bm-tile-value--green" : "bm-tile-value--red";
          responseSub = `${times.length} recorded · market median ~${MARKET_MEDIAN_RESPONSE_HOURS}h`;
        }

        const gaugePct = Math.max(0, Math.min(100, Math.round((m.mrr / BREAK_EVEN_MONTHLY) * 100)));
        const isEmpty = !activeProjects.length && !openLeads.length && !m.mrr;

        $("view-today").innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>${greet}</h2>
              <p>Every line below is something that is currently true, worked out from your
                 own data. Nothing here is a suggestion, and nothing is a placeholder.</p>
            </div>
          </div>

          <div class="bm-tiles">
            <div class="bm-tile">
              <p class="bm-tile-label">Signed MRR</p>
              <p class="bm-tile-value ${m.mrr >= BREAK_EVEN_MONTHLY ? "bm-tile-value--green" : "bm-tile-value--red"}" id="bm-t-mrr">${escapeHtml(inr(m.mrr))}</p>
              <p class="bm-tile-sub">${m.gap > 0
                ? `${escapeHtml(inr(m.gap))} short of break-even`
                : `${escapeHtml(inr(-m.gap))} over break-even`}${m.inKind ? ` · plus ${escapeHtml(formatINR(m.inKind))}/mo in kind, not counted` : ""}</p>
            </div>
            <div class="bm-tile">
              <p class="bm-tile-label">Open leads</p>
              <p class="bm-tile-value ${openLeads.length === 0 ? "bm-tile-value--red" : ""}" id="bm-t-leads">${openLeads.length}</p>
              <p class="bm-tile-sub">${S.leads.length === 0
                ? "Zero leads — that is the number that decides the month."
                : `${openLeads.length} open of ${S.leads.length} total`}</p>
            </div>
            <div class="bm-tile">
              <p class="bm-tile-label">Median first response</p>
              <p class="bm-tile-value ${responseTone}" style="font-size:22px;">${escapeHtml(responseText)}</p>
              <p class="bm-tile-sub">${escapeHtml(responseSub)}</p>
            </div>
            <div class="bm-tile">
              <p class="bm-tile-label">Unpaid invoices</p>
              <p class="bm-tile-value ${m.unpaid.length ? "bm-tile-value--red" : ""}" id="bm-t-unpaid">${escapeHtml(inr(m.unpaidTotal))}</p>
              <p class="bm-tile-sub">${S.invoices.length === 0
                ? "No invoices raised yet — this is empty, not settled."
                : `${m.unpaid.length} outstanding of ${S.invoices.length} raised`}</p>
            </div>
          </div>

          ${isEmpty ? "" : `
          <div class="bm-panel">
            <div class="bm-panel-head">
              <div>
                <h3>${m.gap > 0 ? "Short of break-even" : "Break-even cleared"}</h3>
                <p>Signed cash retainers only. A proposal is not revenue, and counting one
                   here would make the number that decides the month flatter you.</p>
              </div>
              <div class="bm-panel-tools">
                <span class="bm-pill ${m.gap > 0 ? "bm-pill--amber" : "bm-pill--green"}">${gaugePct}%</span>
              </div>
            </div>
            <div class="bm-bar"><span id="bm-gaugebar" style="width:${gaugePct}%"></span></div>
            <p class="bm-hint" style="margin-top:10px;">
              ${escapeHtml(inr(m.mrr))} signed of ${escapeHtml(inr(BREAK_EVEN_MONTHLY))} monthly break-even${m.gap > 0 ? ` · ${escapeHtml(inr(m.gap))} to go` : ""}.
            </p>
          </div>`}

          <div class="bm-panel bm-panel--flush">
            <div class="bm-panel-head"><div><h3>What needs you</h3></div></div>
            <div class="bm-list" id="bm-today-list"></div>
          </div>`;

        // The action list.
        const items = [];
        if (awaiting.length) items.push({
          tone: "bad", goto: "pipeline",
          what: `${awaiting.length} lead${awaiting.length === 1 ? " has" : "s have"} had no first response`,
          why: "Market median is around 42 hours; replying inside five minutes makes qualification roughly 21× more likely. This is the cheapest thing on the page to fix.",
        });

        const blocked = facts.filter((d) => d.openIntake > 0);
        if (blocked.length) {
          const worst = [...blocked].sort((a, b) => (b.oldestOpenDays || 0) - (a.oldestOpenDays || 0))[0];
          items.push({
            tone: (worst.oldestOpenDays || 0) >= 7 ? "bad" : "warn", goto: "delivery",
            what: `${blocked.length} project${blocked.length === 1 ? " is" : "s are"} waiting on the client`,
            why: `Oldest is ${worst.name} at ${worst.oldestOpenDays ?? 0} day${worst.oldestOpenDays === 1 ? "" : "s"}. The portal is already showing them, dated — you do not need to send a chasing message.`,
          });
        }

        const approvals = facts.filter((d) => d.awaitingApproval > 0);
        if (approvals.length) items.push({
          tone: "warn", goto: "delivery",
          what: `${approvals.reduce((s, d) => s + d.awaitingApproval, 0)} deliverable${approvals.reduce((s, d) => s + d.awaitingApproval, 0) === 1 ? " is" : "s are"} sitting in review`,
          why: "The client has them and has not decided. One click on their portal clears each one.",
        });

        const dupes = facts.filter((d) => d.duplicateIntake > 0);
        if (dupes.length) items.push({
          tone: "bad", goto: "delivery",
          what: `${dupes.length} project${dupes.length === 1 ? " has" : "s have"} duplicate requests on the client's list`,
          why: "The same request several times reads as broken, and a client who decides the list is broken ignores all of it. Open the project and use Remove duplicates.",
        });

        const unscheduled = facts.filter((d) => d.milestones.length === 0);
        if (unscheduled.length) items.push({
          tone: "warn", goto: "delivery",
          what: `${unscheduled.length} project${unscheduled.length === 1 ? " has" : "s have"} no milestones`,
          why: "The client cannot see where the project is going, and delivery health cannot tell you whether it is late. Apply a template with a real start date.",
        });

        if (m.unpaid.length) {
          const overdue = m.unpaid.filter((i) => { const d = daysSince(i.dueAt); return d !== null && d > 0; });
          items.push({
            tone: overdue.length ? "bad" : "warn", goto: "money",
            what: `${escapeHtml(inr(m.unpaidTotal))} is unpaid across ${m.unpaid.length} invoice${m.unpaid.length === 1 ? "" : "s"}`,
            why: overdue.length
              ? `${overdue.length} ${overdue.length === 1 ? "is" : "are"} past the due date. Sync payments first — it may already be settled at Razorpay and not yet reconciled here.`
              : "None are past due yet. Sync payments to reconcile anything already settled at Razorpay.",
          });
        }

        const list = $("bm-today-list");

        // An empty system is not a clear day. Saying "nothing needs you" to
        // someone who has simply not set anything up yet is the exact failure
        // CLAUDE.md §4 names — empty is not the same as done.
        if (isEmpty) {
          list.innerHTML = `<button type="button" class="bm-listrow" data-goto="clients">
            <span class="bm-listrow-main">
              <span class="bm-listrow-title">Nothing is set up yet</span>
              <span class="bm-listrow-sub">No active projects, no leads and no signed retainer.
                That is an empty system, not a clear day. Add a client to begin.</span>
            </span>
            <span class="bm-listrow-right"><span class="bm-pill bm-pill--amber">Start here</span>${chev}</span>
          </button>`;
        } else if (!items.length) {
          list.innerHTML = `<div class="bm-listrow" style="cursor:default;">
            <span class="bm-listrow-main">
              <span class="bm-listrow-title">Nothing is waiting on you</span>
              <span class="bm-listrow-sub">No unanswered lead, no client sitting on a request,
                nothing in review, every project scheduled and every invoice settled.
                Computed from your data, not assumed.</span>
            </span>
            <span class="bm-listrow-right"><span class="bm-pill bm-pill--green">Clear</span></span>
          </div>`;
        } else {
          const tone = { bad: "bm-pill--red", warn: "bm-pill--amber", ok: "bm-pill--green" };
          list.innerHTML = items.map((i) => `
            <button type="button" class="bm-listrow" data-goto="${i.goto}">
              <span class="bm-listrow-main">
                <span class="bm-listrow-title">${i.what}</span>
                <span class="bm-listrow-sub">${escapeHtml(i.why)}</span>
              </span>
              <span class="bm-listrow-right">
                <span class="bm-pill ${tone[i.tone]}">${escapeHtml(VIEW_META[i.goto].title)}</span>${chev}
              </span>
            </button>`).join("");
        }

        mo.rows(list.children);
        mo.bar($("bm-gaugebar"));
      };

      /* ══════════════════════════════════════════════════════════
         PIPELINE
         ══════════════════════════════════════════════════════════ */

      RENDER.pipeline = () => {
        const stages = LEAD_STAGES.filter((s) => s.id !== "lost");
        const lost = S.leads.filter((l) => l.stage === "lost");

        $("view-pipeline").innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>Pipeline</h2>
              <p>Move a lead with the arrows. The first-response time is stamped once and
                 never moves again — if it could be edited it would stop meaning anything.</p>
            </div>
            <div class="bm-view-actions">
              <button type="button" class="bm-btn bm-btn--sm" data-new="lead">Add lead</button>
            </div>
          </div>

          <div class="bm-kan" id="bm-kan">
            ${stages.map((st) => {
              const inStage = S.leads.filter((l) => l.stage === st.id);
              return `<div class="bm-kan-col">
                <div class="bm-kan-head">
                  <h4>${escapeHtml(st.label)}</h4>
                  <span class="bm-kan-n">${inStage.length}</span>
                </div>
                <div class="bm-kan-body">
                  ${inStage.length ? inStage.map(leadCard).join("")
                    : `<p class="bm-hint" style="padding:6px 4px;">Empty.</p>`}
                </div>
              </div>`;
            }).join("")}
          </div>

          ${lost.length ? `
          <div class="bm-panel bm-panel--flush" style="margin-top:18px;">
            <div class="bm-panel-head"><div><h3>Lost — ${lost.length}</h3></div></div>
            <div class="bm-list">
              ${lost.map((l) => `<div class="bm-listrow" style="cursor:default;">
                <span class="bm-listrow-main">
                  <span class="bm-listrow-title">${escapeHtml(l.name || "Unnamed")}</span>
                  <span class="bm-listrow-sub">${escapeHtml(SOURCE_LABEL[l.source] || l.source || "source not set")} · created ${escapeHtml(formatDate(l.createdAt))}</span>
                </span>
                <span class="bm-listrow-right">
                  <select data-lossreason="${escapeHtml(l.id)}" aria-label="Loss reason">
                    <option value="">Why lost?</option>
                    ${LOSS_REASONS.map((r) => `<option value="${escapeHtml(r.id)}" ${l.lossReason === r.id ? "selected" : ""}>${escapeHtml(r.label)}</option>`).join("")}
                  </select>
                  <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-lead-reopen="${escapeHtml(l.id)}">Reopen</button>
                  <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-lead-del="${escapeHtml(l.id)}">Delete</button>
                </span>
              </div>`).join("")}
            </div>
          </div>` : ""}

          <div class="bm-split" style="margin-top:18px;">
            <div class="bm-panel">
              <div class="bm-panel-head"><div><h3>Stage conversion</h3>
                <p>Targets come from the sales playbook. Where there is no data this says so
                   rather than printing a zero.</p></div></div>
              <div id="bm-kpi-funnel"></div>
            </div>
            <div class="bm-panel">
              <div class="bm-panel-head"><div><h3>Source mix</h3>
                <p>Any single channel above 50% makes the pipeline fragile.</p></div></div>
              <div id="bm-kpi-sources"></div>
            </div>
            <div class="bm-panel">
              <div class="bm-panel-head"><div><h3>Loss reasons</h3></div></div>
              <div id="bm-kpi-losses"></div>
            </div>
          </div>`;

        renderKpis();
        mo.rows($("bm-kan").querySelectorAll(".bm-lead"), { step: 18 });
      };

      function leadCard(l) {
        const responded = !!l.firstResponseAt;
        const responseMins = responded ? minutesBetween(l.createdAt, l.firstResponseAt) : null;
        const waitingMins = responded ? null : minutesSince(l.createdAt);
        const idx = LEAD_STAGES.findIndex((s) => s.id === l.stage);
        const order = LEAD_STAGES.filter((s) => s.id !== "lost");
        const oi = order.findIndex((s) => s.id === l.stage);

        const responseBit = responded
          ? `<span class="bm-pill ${responseMins !== null && responseMins <= FAST_RESPONSE_MINUTES ? "bm-pill--green" : "bm-pill--muted"}">replied in ${escapeHtml(formatDuration(responseMins))}</span>`
          : `<span class="bm-pill ${waitingMins !== null && waitingMins > FAST_RESPONSE_MINUTES ? "bm-pill--red" : "bm-pill--amber"}">waiting ${escapeHtml(formatDuration(waitingMins))}</span>`;

        return `<article class="bm-lead" data-lead="${escapeHtml(l.id)}">
          <p class="bm-lead-name">${escapeHtml(l.name || "Unnamed")}</p>
          <div class="bm-lead-meta">
            <span>${escapeHtml(SOURCE_LABEL[l.source] || l.source || "source not set")}</span>
            <span>·</span>
            <span>${escapeHtml(formatDate(l.createdAt))}</span>
          </div>
          <div class="bm-lead-meta">${responseBit}</div>
          <div class="bm-lead-actions">
            <button type="button" class="bm-lead-move" data-lead-move="${escapeHtml(l.id)}" data-dir="-1"
              ${oi <= 0 ? "disabled" : ""} aria-label="Move back a stage">←</button>
            <button type="button" class="bm-lead-move" data-lead-move="${escapeHtml(l.id)}" data-dir="1"
              ${oi < 0 || oi >= order.length - 1 ? "disabled" : ""} aria-label="Move forward a stage">→</button>
            ${responded ? "" : `<button type="button" class="bm-lead-move" data-lead-respond="${escapeHtml(l.id)}">Log first response</button>`}
            <button type="button" class="bm-lead-move" data-lead-lose="${escapeHtml(l.id)}">Lost</button>
          </div>
        </article>`;
      }

      function renderKpis() {
        const leads = S.leads;
        const f = $("bm-kpi-funnel"), so = $("bm-kpi-sources"), lo = $("bm-kpi-losses");
        if (!f) return;

        if (!leads.length) {
          const msg = '<p class="bm-empty">No leads recorded yet — nothing to measure against the plan.</p>';
          f.innerHTML = msg; so.innerHTML = msg; lo.innerHTML = msg;
          return;
        }

        const order = LEAD_STAGES.map((s) => s.id).filter((id) => id !== "lost");
        const live = leads.filter((l) => l.stage !== "lost");
        const reached = (id) => live.filter((l) => order.indexOf(l.stage) >= order.indexOf(id)).length;
        const lostCount = leads.length - live.length;

        f.innerHTML = FUNNEL_TARGETS.map((t) => {
          const from = reached(t.from), to = reached(t.to);
          const actual = from > 0 ? to / from : null;
          const meets = actual !== null && actual >= t.target;
          return `<div class="bm-row">
            <div class="bm-row-main">
              <span class="bm-row-title">${escapeHtml(STAGE_LABEL[t.from])} → ${escapeHtml(STAGE_LABEL[t.to])}</span>
              <span class="bm-row-sub">${from} reached ${escapeHtml(STAGE_LABEL[t.from])}${from > 0 ? `, ${to} reached ${escapeHtml(STAGE_LABEL[t.to])}` : ""}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="bm-row-sub">target ${pct(t.target)}</span>
              ${actual === null ? `<span class="bm-pill bm-pill--muted">no data</span>`
                : `<span class="bm-pill ${meets ? "bm-pill--green" : "bm-pill--amber"}">${pct(actual)}</span>`}
            </div>
          </div>`;
        }).join("") + (lostCount
          ? `<p class="bm-hint" style="margin-top:10px;">${lostCount} lost ${lostCount === 1 ? "lead is" : "leads are"} excluded — the stage they were lost at is not recorded.</p>` : "");

        so.innerHTML = LEAD_SOURCES.map((s) => {
          const count = leads.filter((l) => l.source === s.id).length;
          const share = count / leads.length;
          return `<div class="bm-row">
            <div class="bm-row-main">
              <span class="bm-row-title">${escapeHtml(s.label)}</span>
              <span class="bm-row-sub">${count} of ${leads.length}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="bm-row-sub">target ${pct(s.targetShare)}</span>
              <span class="bm-pill ${share > 0.5 ? "bm-pill--red" : "bm-pill--muted"}">${pct(share)}</span>
            </div>
          </div>`;
        }).join("");

        const lost = leads.filter((l) => l.stage === "lost");
        if (!lost.length) { lo.innerHTML = '<p class="bm-empty">No lost deals recorded yet.</p>'; return; }
        const unattributed = lost.filter((l) => !l.lossReason).length;
        lo.innerHTML = LOSS_REASONS.map((r) => {
          const count = lost.filter((l) => l.lossReason === r.id).length;
          const share = count / lost.length;
          const alert = r.alertAbove !== null && share > r.alertAbove;
          return `<div class="bm-row">
            <div class="bm-row-main">
              <span class="bm-row-title">${escapeHtml(r.label)}</span>
              ${alert ? `<span class="bm-row-sub">Above ${pct(r.alertAbove)} — ${escapeHtml(r.then)}.</span>` : ""}
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="bm-row-sub">${count} of ${lost.length}</span>
              <span class="bm-pill ${alert ? "bm-pill--red" : "bm-pill--muted"}">${pct(share)}</span>
            </div>
          </div>`;
        }).join("") + (unattributed
          ? `<p class="bm-hint" style="margin-top:10px;">${unattributed} lost ${unattributed === 1 ? "deal has" : "deals have"} no reason set — these shares are incomplete.</p>` : "");
      }

      /* ══════════════════════════════════════════════════════════
         CLIENTS
         ══════════════════════════════════════════════════════════ */

      const ONBOARDING_STEPS = [
        { id: "org", label: "Client created", hint: "The organisation exists." },
        { id: "signed", label: "Retainer signed", hint: "Until it is signed it is not revenue and does not count towards break-even." },
        { id: "project", label: "Project created", hint: "Add a project so there is something to schedule and show." },
        { id: "login", label: "Login given", hint: "Firebase Console creates the account, Access writes the users document. Both halves, or they sign in to a blank portal." },
        { id: "scope", label: "Agreed scope recorded", hint: "Build it on Scope & quote and save it to this project. Until then progress is a number typed from memory rather than one the system can derive." },
        { id: "intake", label: "Requirements raised", hint: "Until you raise them the portal has nothing to chase the client for." },
        { id: "milestones", label: "Schedule applied", hint: "Apply a milestone template with a real start date so the client can see where the project is going." },
      ];

      function onboardingState(org) {
        const theirs = S.projects.filter((p) => p.orgId === org.id);
        const facts = theirs.map((p) => S.detail[p.id]).filter(Boolean);
        return {
          org: true,
          signed: org.retainerStatus === "signed",
          project: theirs.length > 0,
          login: S.users.some((u) => u.orgId === org.id && u.role === "client"),
          scope: facts.some((f) => f.scope.length > 0),
          intake: facts.some((f) => f.intake.length > 0),
          milestones: facts.some((f) => f.milestones.length > 0),
        };
      }

      RENDER.clients = () => {
        const active = S.orgs.filter((o) => o.kind === "client" && o.status === "active");
        const internal = S.orgs.filter((o) => o.kind === "internal" && o.status !== "archived");
        const archived = S.orgs.filter((o) => o.status === "archived");

        const row = (o) => {
          const done = onboardingState(o);
          const completed = ONBOARDING_STEPS.filter((s) => done[s.id]).length;
          const next = ONBOARDING_STEPS.find((s) => !done[s.id]);
          const theirs = S.projects.filter((p) => p.orgId === o.id);
          const unpaid = S.invoices.filter((i) => i.orgId === o.id && i.status !== "paid");
          const tone = o.retainerStatus === "signed" ? "bm-pill--green"
                     : o.retainerStatus === "proposed" ? "bm-pill--amber" : "bm-pill--muted";
          return `<button type="button" class="bm-listrow bm-listrow--withmono" data-org="${escapeHtml(o.id)}">
            <span class="bm-mono" aria-hidden="true">${escapeHtml(initials(o.name))}</span>
            <span class="bm-listrow-main">
              <span class="bm-listrow-title">${escapeHtml(o.name || "Unnamed")}</span>
              <span class="bm-listrow-sub">${theirs.length} project${theirs.length === 1 ? "" : "s"}${
                unpaid.length ? ` · ${unpaid.length} unpaid invoice${unpaid.length === 1 ? "" : "s"}` : ""
              }${next ? ` · next: ${escapeHtml(next.label.toLowerCase())}` : " · fully onboarded"}</span>
            </span>
            <span class="bm-listrow-right">
              <span class="bm-pill ${tone}">${escapeHtml(o.retainerStatus || "none")}${
                o.retainerStatus === "signed" ? ` ${escapeHtml(formatINR(o.retainer))}` : ""}</span>
              <span class="bm-pill ${next ? "bm-pill--muted" : "bm-pill--green"}">${completed}/${ONBOARDING_STEPS.length}</span>
              ${chev}
            </span>
          </button>`;
        };

        $("view-clients").innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>Clients</h2>
              <p>Open a client to see everything about them in one place — retainer, projects,
                 invoices, portal login and exactly which onboarding step is next.</p>
            </div>
            <div class="bm-view-actions">
              <button type="button" class="bm-btn bm-btn--sm" data-new="org">Add client</button>
            </div>
          </div>

          <div class="bm-panel bm-panel--flush">
            <div class="bm-panel-head"><div><h3>Active clients</h3></div>
              <div class="bm-panel-tools"><span class="bm-pill bm-pill--muted">${active.length}</span></div></div>
            <div class="bm-list" id="bm-client-list">
              ${active.length ? active.map(row).join("")
                : `<p class="bm-empty" style="padding:0 22px 22px;">No clients yet. Adding one is step one — nothing else on this screen can be true until then.</p>`}
            </div>
          </div>

          ${internal.length ? `
          <div class="bm-panel bm-panel--flush">
            <div class="bm-panel-head"><div><h3>Internal</h3></div></div>
            <div class="bm-list">${internal.map(row).join("")}</div>
          </div>` : ""}

          ${archived.length ? `
          <div class="bm-panel bm-panel--flush">
            <div class="bm-panel-head"><div><h3>Archived</h3></div></div>
            <div class="bm-list">${archived.map(row).join("")}</div>
          </div>` : ""}`;

        mo.rows($("bm-client-list").children);
      };

      function openClient(orgId) {
        const o = S.orgById[orgId];
        if (!o) return;
        const done = onboardingState(o);
        const next = ONBOARDING_STEPS.find((s) => !done[s.id]);
        const theirs = S.projects.filter((p) => p.orgId === o.id);
        const invs = S.invoices.filter((i) => i.orgId === o.id);
        const logins = S.users.filter((u) => u.orgId === o.id && u.role === "client");

        drawer({
          title: o.name || "Unnamed",
          sub: `${escapeHtml(o.kind || "client")} · ${escapeHtml(o.status || "active")}`,
          body: `
            <div class="bm-drawer-sec">
              <h4>Retainer</h4>
              <dl class="bm-facts">
                <dt>Monthly</dt><dd>${escapeHtml(formatINR(o.retainer))}${o.retainerInKind ? ` <span class="bm-row-sub">+ ${escapeHtml(formatINR(o.retainerInKind))} in kind, never counted as revenue</span>` : ""}</dd>
                <dt>Status</dt><dd><span class="bm-pill ${o.retainerStatus === "signed" ? "bm-pill--green" : o.retainerStatus === "proposed" ? "bm-pill--amber" : "bm-pill--muted"}">${escapeHtml(o.retainerStatus || "none")}</span></dd>
                ${o.note ? `<dt>Note</dt><dd>${escapeHtml(o.note)}</dd>` : ""}
              </dl>
              <p class="bm-hint" style="margin-top:12px;">
                Only <strong>signed</strong> counts towards break-even. Marking a proposal signed
                changes the number the month is judged on — do it when it is actually signed.
              </p>
              <div class="bm-inline-form" style="margin-top:12px;">
                <input type="number" min="0" step="500" id="bm-d-retainer" value="${Number(o.retainer) || 0}" class="bm-mn-narrow" aria-label="Monthly retainer" />
                <select id="bm-d-rstatus" aria-label="Retainer status">
                  ${["signed", "proposed", "none"].map((s) => `<option value="${s}" ${(o.retainerStatus || "none") === s ? "selected" : ""}>${s}</option>`).join("")}
                </select>
                <button type="button" class="bm-btn bm-btn--sm" data-org-save="${escapeHtml(o.id)}">Save retainer</button>
                <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-org-archive="${escapeHtml(o.id)}">
                  ${o.status === "archived" ? "Restore" : "Archive"}
                </button>
              </div>
            </div>

            <div class="bm-drawer-sec">
              <h4>Onboarding — ${ONBOARDING_STEPS.filter((s) => done[s.id]).length} of ${ONBOARDING_STEPS.length}</h4>
              <ol class="bm-onb-steps">
                ${ONBOARDING_STEPS.map((st) => `<li class="${done[st.id] ? "is-done" : next && st.id === next.id ? "is-next" : ""}">
                  <span class="bm-onb-mark">${done[st.id] ? "✓" : next && st.id === next.id ? "→" : "○"}</span>
                  <span>${escapeHtml(st.label)}</span>
                </li>`).join("")}
              </ol>
              <p class="bm-hint" style="margin-top:10px;">${next
                ? `<strong>Next: ${escapeHtml(next.label)}.</strong> ${escapeHtml(next.hint)}`
                : `All ${ONBOARDING_STEPS.length} done. From here it is delivery.`}</p>
            </div>

            <div class="bm-drawer-sec">
              <h4>Projects</h4>
              ${theirs.length ? `<div class="bm-list">${theirs.map((p) => {
                const d = S.detail[p.id] || { openIntake: 0, scope: [], milestones: [] };
                const prog = scopeProgress(d.scope);
                return `<button type="button" class="bm-listrow" data-project="${escapeHtml(p.id)}" style="padding-left:0;padding-right:0;">
                  <span class="bm-listrow-main">
                    <span class="bm-listrow-title">${escapeHtml(p.name || "Untitled")}</span>
                    <span class="bm-listrow-sub">${escapeHtml(TYPE_LABEL[p.type] || "type not set")} · ${
                      prog === null ? "no agreed scope" : `${prog}% delivered`}${
                      d.openIntake ? ` · ${d.openIntake} open with the client` : ""}</span>
                  </span>
                  <span class="bm-listrow-right">${chev}</span>
                </button>`;
              }).join("")}</div>`
                : `<p class="bm-empty">No projects yet.</p>`}
            </div>

            <div class="bm-drawer-sec">
              <h4>Invoices</h4>
              ${invs.length ? `<div class="bm-list">${invs.map(invoiceRow).join("")}</div>`
                : `<p class="bm-empty">No invoices raised. That is empty, not settled.</p>`}
            </div>

            <div class="bm-drawer-sec">
              <h4>Portal login</h4>
              ${logins.length
                ? `<dl class="bm-facts">${logins.map((u) => `<dt>${escapeHtml(u.name || "—")}</dt><dd>${escapeHtml(u.username || "—")}</dd>`).join("")}</dl>`
                : `<p class="bm-empty">No login yet — they cannot see anything. Create one under Access.</p>`}
            </div>`,
        });
      }

      /* ══════════════════════════════════════════════════════════
         DELIVERY
         ══════════════════════════════════════════════════════════ */

      RENDER.delivery = () => {
        const projects = [...S.projects].sort((a, b) =>
          (S.orgById[a.orgId]?.name || "").localeCompare(S.orgById[b.orgId]?.name || ""));

        const row = (p) => {
          const d = S.detail[p.id];
          if (!d) return "";
          const orgName = S.orgById[p.orgId]?.name || p.orgId;
          const prog = scopeProgress(d.scope);

          // Empty is not on-track. A project with no milestones and no scope
          // must never render like one that is finished.
          let health, tone;
          if (!d.milestones.length && !d.scope.length) { health = "Not set up"; tone = "bm-pill--muted"; }
          else if (d.openIntake) { health = `${d.oldestOpenDays ?? 0}d blocked`; tone = ageTone(d.oldestOpenDays); }
          else if (!d.next) { health = "Milestones complete"; tone = "bm-pill--green"; }
          else { health = d.next.owner === "client" ? "Waiting on client" : "With us"; tone = d.next.owner === "client" ? "bm-pill--amber" : "bm-pill--muted"; }

          return `<button type="button" class="bm-listrow bm-listrow--withmono" data-project="${escapeHtml(p.id)}">
            <span class="bm-mono" aria-hidden="true">${escapeHtml(initials(orgName))}</span>
            <span class="bm-listrow-main">
              <span class="bm-listrow-title">${escapeHtml(p.name || orgName)}</span>
              <span class="bm-listrow-sub">${escapeHtml(orgName)} · ${escapeHtml(TYPE_LABEL[p.type] || "type not set")} · ${
                d.next ? `next: ${escapeHtml(d.next.title || "untitled")} ${escapeHtml(formatDate(d.next.dueAt))}` : "no milestone pending"}</span>
            </span>
            <span class="bm-listrow-right">
              ${d.awaitingApproval ? `<span class="bm-pill bm-pill--amber">${d.awaitingApproval} in review</span>` : ""}
              <span class="bm-pill bm-pill--muted">${prog === null ? "no scope" : `${prog}%`}</span>
              <span class="bm-pill ${tone}">${escapeHtml(health)}</span>
              ${chev}
            </span>
          </button>`;
        };

        $("view-delivery").innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>Delivery</h2>
              <p>One row per project. Open one to work on it — scope, milestones, what you are
                 waiting on the client for, and what they have to approve.</p>
            </div>
            <div class="bm-view-actions">
              <button type="button" class="bm-btn bm-btn--sm" data-new="project">Add project</button>
            </div>
          </div>

          <div class="bm-panel bm-panel--flush">
            <div class="bm-panel-head"><div><h3>Projects</h3></div>
              <div class="bm-panel-tools"><span class="bm-pill bm-pill--muted">${projects.length}</span></div></div>
            <div class="bm-list" id="bm-project-list">
              ${projects.length ? projects.map(row).join("")
                : `<p class="bm-empty" style="padding:0 22px 22px;">No projects yet.</p>`}
            </div>
          </div>`;

        mo.rows($("bm-project-list").children);
      };

      function openProject(pid) {
        const p = S.projects.find((x) => x.id === pid);
        const d = S.detail[pid];
        if (!p || !d) return;
        const orgName = S.orgById[p.orgId]?.name || p.orgId;
        const hasTemplate = p.type && MILESTONE_TEMPLATES[p.type];

        drawer({
          title: p.name || "Untitled project",
          sub: escapeHtml(orgName),
          body: `
            <div class="bm-drawer-sec">
              <h4>Project</h4>
              <div class="bm-manage-row" data-pfields="${escapeHtml(p.id)}">
                <input class="bm-mn-title" data-pfield="name" value="${escapeHtml(p.name || "")}" placeholder="Project name" />
                <select data-pfield="type">
                  <option value="">Type not set</option>
                  ${SERVICE_TYPES.map((t) => `<option value="${escapeHtml(t.id)}" ${p.type === t.id ? "selected" : ""}>${escapeHtml(t.label)}</option>`).join("")}
                </select>
                <input class="bm-mn-narrow" type="date" data-pfield="dueAt" value="${dateInputValue(p.dueAt)}" title="Due date" />
                <label class="bm-mn-check"><input type="checkbox" data-pfield="billable" ${p.billable ? "checked" : ""} /> Billable</label>
              </div>
              <p class="bm-hint" style="margin-top:10px;">
                There is no percentage field. Progress is derived from the agreed scope below,
                weighted by build days — a typed percentage is a guess wearing a number's clothes.
              </p>
              <div class="bm-inline-form" style="margin-top:12px;">
                ${hasTemplate
                  ? `<span class="bm-row-sub">Stamp the ${escapeHtml(TYPE_LABEL[p.type])} template (${MILESTONE_TEMPLATES[p.type].length} milestones) from:</span>
                     <input class="bm-mn-narrow" type="date" id="bm-tpl-start" />
                     <button type="button" class="bm-btn bm-btn--sm" data-apply-template="${escapeHtml(p.id)}" data-type="${escapeHtml(p.type)}">Apply template</button>`
                  : `<span class="bm-row-sub">Set a project type to stamp a milestone template.</span>`}
              </div>
            </div>

            <div class="bm-drawer-sec">
              <h4>Agreed scope — what was sold, and how much is done</h4>
              ${scopeBlock(p.id, d.scope)}
            </div>

            <div class="bm-drawer-sec">
              <h4>Milestones</h4>
              ${d.milestones.length ? d.milestones.map((m) => `
                <div class="bm-manage-row" data-milestone="${escapeHtml(m.id)}" data-pid="${escapeHtml(p.id)}">
                  <input class="bm-mn-title" data-field="title" value="${escapeHtml(m.title || "")}" placeholder="Title" />
                  <select data-field="owner">
                    <option value="us" ${m.owner === "us" ? "selected" : ""}>Us</option>
                    <option value="client" ${m.owner === "client" ? "selected" : ""}>Client</option>
                  </select>
                  <select data-field="status">
                    <option value="todo" ${m.status === "todo" ? "selected" : ""}>To do</option>
                    <option value="in_progress" ${m.status === "in_progress" ? "selected" : ""}>In progress</option>
                    <option value="done" ${m.status === "done" ? "selected" : ""}>Done</option>
                  </select>
                  <input class="bm-mn-narrow" type="date" data-field="dueAt" value="${dateInputValue(m.dueAt)}" />
                  <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-del-milestone="${escapeHtml(m.id)}" data-pid="${escapeHtml(p.id)}">Delete</button>
                </div>`).join("")
                : `<p class="bm-empty">No milestones yet — the client cannot see where this is going.</p>`}
              <div class="bm-manage-row" data-add="milestone" data-pid="${escapeHtml(p.id)}">
                <input class="bm-mn-title" data-new="title" placeholder="New milestone" />
                <select data-new="owner"><option value="us">Us</option><option value="client">Client</option></select>
                <input class="bm-mn-narrow" type="date" data-new="dueAt" />
                <button type="button" class="bm-btn bm-btn--sm" data-add-milestone="${escapeHtml(p.id)}">Add</button>
              </div>
            </div>

            <div class="bm-drawer-sec">
              <h4>What we need from the client${d.openIntake ? ` — ${d.openIntake} open` : ""}</h4>
              ${d.intake.length ? d.intake.map((i) => {
                const age = daysSince(i.raisedAt);
                return `<div class="bm-manage-row" data-intake="${escapeHtml(i.id)}" data-pid="${escapeHtml(p.id)}">
                  <input class="bm-mn-title" data-field="label" value="${escapeHtml(i.label || "")}" placeholder="Label" />
                  <select data-field="group">
                    ${Object.entries(GROUP_LABEL).map(([k, v]) => `<option value="${k}" ${i.group === k ? "selected" : ""}>${v}</option>`).join("")}
                  </select>
                  <label class="bm-mn-check"><input type="checkbox" data-field="done" ${i.done ? "checked" : ""} /> Done</label>
                  <span class="bm-pill ${i.done ? "bm-pill--green" : ageTone(age)}">${i.done ? "cleared" : `${age ?? 0}d`}</span>
                  <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-del-intake="${escapeHtml(i.id)}" data-pid="${escapeHtml(p.id)}">Delete</button>
                </div>`;
              }).join("")
                : `<p class="bm-empty">Nothing raised. The portal has nothing to chase them for — that is not the same as them being clear.</p>`}
              <div class="bm-manage-row" data-add="intake" data-pid="${escapeHtml(p.id)}">
                <input class="bm-mn-title" data-new="label" placeholder="New request" />
                <select data-new="group">${Object.entries(GROUP_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
                <button type="button" class="bm-btn bm-btn--sm" data-add-intake="${escapeHtml(p.id)}">Add</button>
                ${d.duplicateIntake ? `<button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-dedupe="${escapeHtml(p.id)}">Remove ${d.duplicateIntake} duplicate set${d.duplicateIntake === 1 ? "" : "s"}</button>` : ""}
              </div>
            </div>

            <div class="bm-drawer-sec">
              <h4>Deliverables${d.awaitingApproval ? ` — ${d.awaitingApproval} awaiting them` : ""}</h4>
              ${d.deliverables.length ? d.deliverables.map((x) => `
                <div class="bm-manage-row" data-deliverable="${escapeHtml(x.id)}" data-pid="${escapeHtml(p.id)}">
                  <input class="bm-mn-title" data-field="title" value="${escapeHtml(x.title || "")}" placeholder="Title" />
                  <input class="bm-mn-narrow" data-field="version" value="${escapeHtml(x.version ?? "")}" placeholder="Version" />
                  <input class="bm-mn-url" data-field="url" value="${escapeHtml(x.url || "")}" placeholder="https://…" />
                  <select data-field="status">
                    <option value="in_review" ${x.status === "in_review" ? "selected" : ""}>In review</option>
                    <option value="approved" ${x.status === "approved" ? "selected" : ""}>Approved</option>
                    <option value="changes_requested" ${x.status === "changes_requested" ? "selected" : ""}>Changes requested</option>
                  </select>
                  <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-del-deliverable="${escapeHtml(x.id)}" data-pid="${escapeHtml(p.id)}">Delete</button>
                </div>`).join("")
                : `<p class="bm-empty">Nothing up for approval yet.</p>`}
              <div class="bm-manage-row" data-add="deliverable" data-pid="${escapeHtml(p.id)}">
                <input class="bm-mn-title" data-new="title" placeholder="New deliverable" />
                <input class="bm-mn-narrow" data-new="version" placeholder="Version" />
                <input class="bm-mn-url" data-new="url" placeholder="https://…" />
                <button type="button" class="bm-btn bm-btn--sm" data-add-deliverable="${escapeHtml(p.id)}">Add</button>
              </div>
            </div>

            <div class="bm-drawer-sec">
              <h4>Danger</h4>
              <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-del-project="${escapeHtml(p.id)}">Delete this project</button>
            </div>`,
        });
      }

      function scopeBlock(pid, scope) {
        if (!scope.length) {
          return `<p class="bm-empty">No agreed scope recorded. Build it on
            <a href="/quote">Scope &amp; quote</a> and save it to this project — then progress
            is measured instead of estimated.</p>`;
        }
        const p = scopeProgress(scope);
        const v = scopeValue(scope);
        const nextOf = (st) => SCOPE_STATUS_IDS[Math.min(SCOPE_STATUS_IDS.indexOf(st) + 1, SCOPE_STATUS_IDS.length - 1)];
        const tone = { agreed: "bm-pill--muted", building: "bm-pill--amber", delivered: "bm-pill--green", accepted: "bm-pill--green" };
        return `
          <div class="bm-scope-head">
            <div><strong>${p}% delivered</strong><span class="bm-row-sub"> · weighted by build days</span></div>
            <div class="bm-row-sub">${escapeHtml(formatINR(v.accepted))} accepted of ${escapeHtml(formatINR(v.agreed))}</div>
          </div>
          <div class="bm-bar" style="margin-bottom:12px;"><span style="width:${p}%"></span></div>
          ${scope.map((l) => {
            const last = l.status === "accepted";
            const label = SCOPE_STATUS.find((x) => x.id === l.status)?.label || l.status;
            return `<div class="bm-scope-row">
              <span class="bm-scope-label">${escapeHtml(l.label)}</span>
              <span class="bm-row-sub">${l.days}d · ${escapeHtml(formatINR(l.amount))}</span>
              <button type="button" class="bm-pill ${tone[l.status] || "bm-pill--muted"}"
                ${last ? "disabled" : ""} data-scope-advance="${escapeHtml(l.id)}"
                data-pid="${escapeHtml(pid)}" data-next="${nextOf(l.status)}"
                title="${last ? "Accepted — the last state" : `Click to mark ${nextOf(l.status)}`}">
                ${escapeHtml(label)}${last ? "" : " →"}
              </button>
            </div>`;
          }).join("")}
          <p class="bm-hint" style="margin-top:10px;">
            A line counts as money only at <strong>accepted</strong>. Delivered is handed over,
            not confirmed — counting effort as revenue is the same mistake as counting a proposal.
          </p>`;
      }

      /* ══════════════════════════════════════════════════════════
         MONEY
         ══════════════════════════════════════════════════════════ */

      function invoiceRow(i) {
        const org = S.orgById[i.orgId];
        const overdueDays = i.status !== "paid" ? daysSince(i.dueAt) : null;
        const overdue = overdueDays !== null && overdueDays > 0;
        return `<div class="bm-listrow" style="cursor:default;">
          <span class="bm-listrow-main">
            <span class="bm-listrow-title">${escapeHtml(i.label || "Invoice")} — ${escapeHtml(formatINR(i.amount))}</span>
            <span class="bm-listrow-sub">${escapeHtml(org?.name || i.orgId)}${
              i.dueAt ? ` · due ${escapeHtml(formatDate(i.dueAt))}` : " · no due date"}</span>
          </span>
          <span class="bm-listrow-right">
            <span class="bm-pill ${i.status === "paid" ? "bm-pill--green" : overdue ? "bm-pill--red" : "bm-pill--amber"}">${
              i.status === "paid" ? "paid" : overdue ? `${overdueDays}d overdue` : "due"}</span>
            ${i.status === "paid"
              ? `<button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-inv-unpay="${escapeHtml(i.id)}">Mark unpaid</button>`
              : `<button type="button" class="bm-btn bm-btn--sm" data-inv-pay="${escapeHtml(i.id)}">Mark paid</button>`}
            <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-inv-del="${escapeHtml(i.id)}">Delete</button>
          </span>
        </div>`;
      }

      RENDER.money = () => {
        const m = money();
        const clients = S.orgs.filter((o) => o.kind === "client" && o.status === "active");
        const sorted = [...S.invoices].sort((a, b) => {
          const rank = (x) => (x.status === "paid" ? 1 : 0);
          if (rank(a) !== rank(b)) return rank(a) - rank(b);
          return (a.dueAt?.toMillis?.() || 0) - (b.dueAt?.toMillis?.() || 0);
        });

        $("view-money").innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>Money</h2>
              <p>Signed retainers and every invoice ever raised. Nothing on this screen counts a
                 proposal, and nothing counts an invoice until it is actually paid.</p>
            </div>
            <div class="bm-view-actions">
              <button type="button" class="bm-btn bm-btn--sm" data-new="invoice">Raise invoice</button>
            </div>
          </div>

          <div class="bm-tiles">
            <div class="bm-tile">
              <p class="bm-tile-label">Signed MRR</p>
              <p class="bm-tile-value ${m.mrr >= BREAK_EVEN_MONTHLY ? "bm-tile-value--green" : "bm-tile-value--red"}" id="bm-mrr">${escapeHtml(inr(m.mrr))}</p>
              <p class="bm-tile-sub">Break-even is ${escapeHtml(inr(BREAK_EVEN_MONTHLY))}/month</p>
            </div>
            <div class="bm-tile">
              <p class="bm-tile-label">Outstanding</p>
              <p class="bm-tile-value ${m.unpaid.length ? "bm-tile-value--red" : ""}">${escapeHtml(inr(m.unpaidTotal))}</p>
              <p class="bm-tile-sub">${S.invoices.length === 0
                ? "No invoices raised yet — empty, not settled."
                : `${m.unpaid.length} unpaid of ${S.invoices.length}`}</p>
            </div>
            <div class="bm-tile">
              <p class="bm-tile-label">Collected</p>
              <p class="bm-tile-value">${escapeHtml(inr(m.paidTotal))}</p>
              <p class="bm-tile-sub">${S.invoices.length === 0 ? "Nothing raised yet" : "Across all invoices ever raised"}</p>
            </div>
          </div>

          <div class="bm-panel bm-panel--flush">
            <div class="bm-panel-head">
              <div><h3>Invoice ledger</h3>
                <p>Marking one paid by hand is for cash and bank transfers. For anything paid
                   online use Sync payments — it asks Razorpay what it was actually paid.</p></div>
            </div>
            <div class="bm-list" id="bm-inv-list">
              ${sorted.length ? sorted.map(invoiceRow).join("")
                : `<p class="bm-empty" style="padding:0 22px 22px;">No invoices raised yet.</p>`}
            </div>
          </div>

          <div class="bm-panel bm-panel--flush">
            <div class="bm-panel-head"><div><h3>Retainers</h3>
              <p>Proposals are shown faded and are never summed into MRR.</p></div></div>
            <div class="bm-list">
              ${clients.length ? clients.map((o) => {
                const signed = o.retainerStatus === "signed";
                return `<button type="button" class="bm-listrow" data-org="${escapeHtml(o.id)}" style="${signed ? "" : "opacity:.62"}">
                  <span class="bm-listrow-main">
                    <span class="bm-listrow-title">${escapeHtml(o.name)}</span>
                    ${o.note ? `<span class="bm-listrow-sub">${escapeHtml(o.note)}</span>` : ""}
                  </span>
                  <span class="bm-listrow-right">
                    <span>${escapeHtml(formatINR(o.retainer))}</span>
                    <span class="bm-pill ${signed ? "bm-pill--green" : o.retainerStatus === "proposed" ? "bm-pill--amber" : "bm-pill--muted"}">${escapeHtml(o.retainerStatus || "none")}</span>
                    ${chev}
                  </span>
                </button>`;
              }).join("")
                : `<p class="bm-empty" style="padding:0 22px 22px;">No client organisations yet.</p>`}
            </div>
          </div>`;

        mo.rows($("bm-inv-list").children);
      };

      /* ══════════════════════════════════════════════════════════
         ACCESS
         ══════════════════════════════════════════════════════════ */

      RENDER.access = () => {
        const clientUsers = S.users.filter((u) => u.role === "client");

        $("view-access").innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>Access</h2>
              <p>Who can sign in to a client portal. This form never asks for a password —
                 the password is set in the Firebase Console and exists nowhere else.</p>
            </div>
          </div>

          <div class="bm-split">
            <div class="bm-panel">
              <div class="bm-panel-head"><div><h3>Give a client a login</h3></div>
                <div class="bm-panel-tools">
                  <button type="button" class="bm-help" data-runbook="ops-client-login" data-runbook-label="Create a client login">Playbook</button>
                </div>
              </div>
              <ol style="margin:0 0 18px;padding-left:20px;font-size:13px;color:var(--bm-muted);display:flex;flex-direction:column;gap:7px;line-height:1.55;">
                <li>Firebase Console → Authentication → Users → Add user. Use the synthetic email shown below, and set the password <strong>there</strong> — never in this app.</li>
                <li>Copy the UID from the new row.</li>
                <li>Paste it below with the organisation, display name and username.</li>
              </ol>
              <form id="bm-access-form">
                <div class="bm-field">
                  <label for="bm-a-username">Username</label>
                  <input id="bm-a-username" autocapitalize="none" spellcheck="false" placeholder="greenbasket" required />
                  <span class="bm-row-sub" id="bm-a-preview">Signs in as —</span>
                </div>
                <div class="bm-field">
                  <label for="bm-a-name">Display name</label>
                  <input id="bm-a-name" placeholder="Green Basket" required />
                </div>
                <div class="bm-field">
                  <label for="bm-a-org">Organisation</label>
                  <select id="bm-a-org" required>
                    ${S.orgs.map((o) => `<option value="${escapeHtml(o.id)}">${escapeHtml(o.name)}${o.status === "archived" ? " (archived)" : ""}</option>`).join("")}
                  </select>
                </div>
                <div class="bm-field">
                  <label for="bm-a-uid">Firebase Auth UID</label>
                  <input id="bm-a-uid" placeholder="paste the UID from the console" required />
                </div>
                <button type="submit" class="bm-btn bm-btn--sm">Save</button>
                <p class="bm-status" id="bm-a-status" hidden></p>
              </form>
            </div>

            <div class="bm-panel bm-panel--flush">
              <div class="bm-panel-head"><div><h3>Existing logins</h3>
                <p>A client with no <code>users</code> document cannot read anything at all —
                   not even their own organisation.</p></div></div>
              <div class="bm-list">
                ${clientUsers.length ? clientUsers.map((u) => `
                  <div class="bm-listrow" style="cursor:default;">
                    <span class="bm-listrow-main">
                      <span class="bm-listrow-title">${escapeHtml(u.name || u.username || u.id)}</span>
                      <span class="bm-listrow-sub">${escapeHtml(u.username || "—")} · ${escapeHtml(S.orgById[u.orgId]?.name || u.orgId || "no org")}</span>
                    </span>
                    <span class="bm-listrow-right">
                      <span class="bm-pill ${S.orgById[u.orgId] ? "bm-pill--green" : "bm-pill--red"}">${S.orgById[u.orgId] ? "linked" : "orphaned"}</span>
                    </span>
                  </div>`).join("")
                  : `<p class="bm-empty" style="padding:0 22px 22px;">No client logins yet.</p>`}
              </div>
            </div>
          </div>`;

        const uname = $("bm-a-username");
        const preview = () => { $("bm-a-preview").textContent = `Signs in as ${resolveUsernameToEmail(uname.value || "username")}`; };
        uname.addEventListener("input", preview);
        preview();

        $("bm-access-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const st = $("bm-a-status");
          const uid = $("bm-a-uid").value.trim();
          const name = $("bm-a-name").value.trim();
          const orgId = $("bm-a-org").value;
          const email = resolveUsernameToEmail(uname.value);
          const username = email.split("@")[0];
          if (!uid || !name || !orgId || !username) {
            st.hidden = false; st.className = "bm-status bm-status--error";
            st.textContent = "Fill in every field."; return;
          }
          try {
            await setClientUser(uid, { orgId, role: "client", name, username });
            await logActivity("access.grant",
              `Portal login granted: ${username} → ${S.orgById[orgId]?.name || orgId}`,
              { orgId, target: username });
            st.hidden = false; st.className = "bm-status bm-status--ok";
            st.textContent = `Saved. ${username} signs in with ${email} and the password you set in the Console.`;
            await refresh();
          } catch (err) {
            st.hidden = false; st.className = "bm-status bm-status--error";
            st.textContent = "Couldn't save: " + (err?.message || err);
          }
        });
      };

      /* ══════════════════════════════════════════════════════════
         ACTIVITY — the audit log (§9 item 4)
         ══════════════════════════════════════════════════════════ */

      const stamp = (ts) => {
        if (!ts) return "—";
        const d = typeof ts.toDate === "function" ? ts.toDate() : new Date(ts);
        return Number.isNaN(d.getTime()) ? "—"
          : d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      };

      /* Loaded lazily, NOT in loadAll(). If the rules for this collection are
         not published yet the read is denied, and a denied read inside the
         boot fetch would take the whole CRM down with it. Here it takes down
         one panel, which then explains itself. */
      RENDER.activity = () => {
        $("view-activity").innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>Activity</h2>
              <p>Every action that changes money, access or delivery status, as it happened.
                 Append-only — entries cannot be edited or deleted by anyone, including you.
                 That is what makes it worth reading.</p>
            </div>
            <div class="bm-view-actions">
              <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" id="bm-act-reload">Reload</button>
            </div>
          </div>
          <div class="bm-panel bm-panel--flush">
            <div class="bm-list" id="bm-activity-list">
              <p class="bm-empty" style="padding:22px;">Loading…</p>
            </div>
          </div>`;

        $("bm-act-reload").addEventListener("click", () => RENDER.activity());

        getActivity(200).then((rows) => {
          const el = $("bm-activity-list");
          if (!el) return;

          /* An empty log is NOT a quiet week — it may be a log that has never
             recorded anything because nothing has happened SINCE it was
             switched on. Saying so is the same rule as everywhere else on this
             screen: empty is not the same as done. */
          if (!rows.length) {
            el.innerHTML = `<p class="bm-empty" style="padding:22px;">
              No entries yet. The log only records what happens from the moment its rules
              go live — it cannot reconstruct anything that happened before that, and it is
              not claiming nothing did.
            </p>`;
            return;
          }

          el.innerHTML = rows.map((r) => `
            <div class="bm-listrow" style="cursor:default;">
              <span class="bm-listrow-main">
                <span class="bm-listrow-title">${escapeHtml(r.summary || r.action || "—")}</span>
                <span class="bm-listrow-sub">${escapeHtml(r.actorEmail || r.actor || "unknown")} · ${escapeHtml(stamp(r.at))}</span>
              </span>
              <span class="bm-listrow-right">
                <span class="bm-pill bm-pill--muted">${escapeHtml(r.action || "—")}</span>
                ${r.amount ? `<span class="bm-pill bm-pill--muted">${escapeHtml(formatINR(r.amount))}</span>` : ""}
              </span>
            </div>`).join("");
          mo.rows(el.children);
        }).catch((err) => {
          const el = $("bm-activity-list");
          if (!el) return;
          /* Detect on the SDK's error CODE, not on its message. An earlier
             version matched /permission|insufficient/ against the message and
             missed the real one: the emulator says "false for 'list' @ L62"
             (L62 being the catch-all deny), which contains neither word. The
             code is the stable contract; the message is not. */
          const denied = err?.code === "permission-denied"
            || /permission|insufficient|false for/i.test(err?.message || "");
          /* Denied and empty must not look the same. A blank panel here would
             read as "nothing has happened" when the truth is "this cannot be
             read at all yet". */
          el.innerHTML = `<p class="bm-empty" style="padding:22px;">
            ${denied
              ? `<strong>The rules for this collection are not published yet.</strong><br>
                 Firestore is refusing the read, which is correct — <code>activity</code> is
                 denied by the catch-all until the updated <code>firestore.rules</code> is
                 published in the Firebase Console. Everything else on this screen works
                 normally; entries are being discarded rather than stored until then.`
              : escapeHtml("Could not read the log: " + (err?.message || err))}
          </p>`;
        });
      };

      /* ══════════════════════════════════════════════════════════
         OVERLAYS — drawer, modal, command palette
         ══════════════════════════════════════════════════════════ */

      let lastFocus = null;

      function closeOverlay() {
        const host = $("bm-overlay");
        const panel = host.querySelector(".bm-drawer, .bm-modal, .bm-cmd");
        const scrim = host.querySelector(".bm-drawer-scrim, .bm-modal-scrim, .bm-cmd-scrim");
        if (!panel && !scrim) return;
        const isDrawer = !!host.querySelector(".bm-drawer");
        const finish = () => { host.innerHTML = ""; lastFocus?.focus?.(); lastFocus = null; };
        if (isDrawer) mo.drawerOut(panel, scrim).then(finish);
        else finish();
      }

      function drawer({ title, sub, body }) {
        lastFocus = document.activeElement;
        $("bm-overlay").innerHTML = `
          <div class="bm-drawer-scrim" data-close></div>
          <aside class="bm-drawer" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
            <div class="bm-drawer-head">
              <div>
                <h3>${escapeHtml(title)}</h3>
                <p>${sub}</p>
              </div>
              <button type="button" class="bm-drawer-close" data-close aria-label="Close">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div class="bm-drawer-body">${body}</div>
          </aside>`;
        mo.drawerIn($("bm-overlay").querySelector(".bm-drawer"), $("bm-overlay").querySelector(".bm-drawer-scrim"));
        $("bm-overlay").querySelector(".bm-drawer-close")?.focus();
      }

      function modal({ title, note, body, submitLabel = "Save", onSubmit }) {
        lastFocus = document.activeElement;
        $("bm-overlay").innerHTML = `
