                  <input class="bm-mn-narrow" data-field="version" value="${escapeHtml(x.version ?? "")}" placeholder="Version" />
                  <input class="bm-mn-url" data-field="url" value="${escapeHtml(x.url || "")}" placeholder="https://…" />
                  <select data-field="status">
                    <option value="in_review" ${x.status === "in_review" ? "selected" : ""}>In review</option>
                    <option value="approved" ${x.status === "approved" ? "selected" : ""}>Approved</option>
                    <option value="changes_requested" ${x.status === "changes_requested" ? "selected" : ""}>Changes requested</option>
                  </select>
                  <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-del-deliverable="${escapeHtml(x.id)}" data-pid="${escapeHtml(p.id)}">Delete</button>
                </div>`).join("")
                : `<p class="bm-empty">Nothing up for approval yet.</p>`}
              <div class="bm-manage-row" data-add="deliverable" data-pid="${escapeHtml(p.id)}">
                <input class="bm-mn-title" data-new="title" placeholder="New deliverable" />
                <input class="bm-mn-narrow" data-new="version" placeholder="Version" />
                <input class="bm-mn-url" data-new="url" placeholder="https://…" />
                <button type="button" class="bm-btn bm-btn--sm" data-add-deliverable="${escapeHtml(p.id)}">Add</button>
              </div>
            </div>

            <div class="bm-drawer-sec">
              <h4>Danger</h4>
              <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-del-project="${escapeHtml(p.id)}">Delete this project</button>
            </div>`,
        });
      }

      function scopeBlock(pid, scope) {
        if (!scope.length) {
          return `<p class="bm-empty">No agreed scope recorded. Build it on
            <a href="/quote">Scope &amp; quote</a> and save it to this project — then progress
            is measured instead of estimated.</p>`;
        }
        const p = scopeProgress(scope);
        const v = scopeValue(scope);
        const nextOf = (st) => SCOPE_STATUS_IDS[Math.min(SCOPE_STATUS_IDS.indexOf(st) + 1, SCOPE_STATUS_IDS.length - 1)];
        const tone = { agreed: "bm-pill--muted", building: "bm-pill--amber", delivered: "bm-pill--green", accepted: "bm-pill--green" };
        return `
          <div class="bm-scope-head">
            <div><strong>${p}% delivered</strong><span class="bm-row-sub"> · weighted by build days</span></div>
            <div class="bm-row-sub">${escapeHtml(formatINR(v.accepted))} accepted of ${escapeHtml(formatINR(v.agreed))}</div>
          </div>
          <div class="bm-bar" style="margin-bottom:12px;"><span style="width:${p}%"></span></div>
          ${scope.map((l) => {
            const last = l.status === "accepted";
            const label = SCOPE_STATUS.find((x) => x.id === l.status)?.label || l.status;
            return `<div class="bm-scope-row" data-scope-line="${escapeHtml(l.id)}" data-pid="${escapeHtml(pid)}">
              <span class="bm-scope-label">${escapeHtml(l.label)}</span>
              <span class="bm-inline-form" style="gap:5px;">
                <input class="bm-mn-narrow" type="number" min="0" step="1" data-sfield="days"
                  value="${Number(l.days) || 0}" title="Build days" aria-label="Build days" style="width:66px;" />
                <input class="bm-mn-narrow" type="number" min="0" step="1000" data-sfield="amount"
                  value="${Number(l.amount) || 0}" title="Price in rupees" aria-label="Price in rupees" style="width:104px;" />
              </span>
              <button type="button" class="bm-pill ${tone[l.status] || "bm-pill--muted"}"
                ${last ? "disabled" : ""} data-scope-advance="${escapeHtml(l.id)}"
                data-pid="${escapeHtml(pid)}" data-next="${nextOf(l.status)}"
                title="${last ? "Accepted — the last state" : `Click to mark ${nextOf(l.status)}`}">
                ${escapeHtml(label)}${last ? "" : " →"}
              </button>
            </div>`;
          }).join("")}
          <p class="bm-hint" style="margin-top:10px;">
            Days and price are editable — change either and the percentage, the project's
            value and your monthly run rate all follow. A line counts as money only at
            <strong>accepted</strong>: delivered is handed over, not confirmed.
          </p>`;
      }

      /* ══════════════════════════════════════════════════════════
         MONEY
         ══════════════════════════════════════════════════════════ */

      function invoiceRow(i) {
        const org = S.orgById[i.orgId];
        const state = invoiceState(i);
        const received = invoiceReceived(i);
        const owed = invoiceOutstanding(i);
        const overdueDays = state !== "paid" ? daysSince(i.dueAt) : null;
        const overdue = overdueDays !== null && overdueDays > 0;

        const pill = state === "paid" ? { tone: "bm-pill--green", text: "paid" }
          : state === "part" ? { tone: "bm-pill--amber", text: `${escapeHtml(formatINR(owed))} left` }
          : overdue ? { tone: "bm-pill--red", text: `${overdueDays}d overdue` }
          : { tone: "bm-pill--amber", text: "due" };

        return `<div class="bm-listrow" style="cursor:default;">
          <span class="bm-listrow-main">
            <span class="bm-listrow-title">${escapeHtml(i.label || "Invoice")} — ${escapeHtml(formatINR(i.amount))}</span>
            <span class="bm-listrow-sub">${escapeHtml(org?.name || i.orgId)}${
              i.dueAt ? ` · due ${escapeHtml(formatDate(i.dueAt))}` : " · no due date"}${
              state === "part" ? ` · ${escapeHtml(formatINR(received))} received` : ""}</span>
          </span>
          <span class="bm-listrow-right">
            <span class="bm-pill ${pill.tone}">${pill.text}</span>
            <button type="button" class="bm-btn bm-btn--sm" data-inv-doc="${escapeHtml(i.id)}">Invoice</button>
            <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-inv-record="${escapeHtml(i.id)}">Record payment</button>
            <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-inv-del="${escapeHtml(i.id)}">Delete</button>
          </span>
        </div>`;
      }

      /* ONE control for every payment case. It used to be two buttons that
         swapped — Mark paid / Mark unpaid — which could only ever express
         all-or-nothing, and crowded the row on a phone besides. This asks for
         the total received, pre-filled with the full amount, so settling in
         full is still one tap and a part payment is a number. */
      function recordPaymentFor(id) {
        const inv = S.invoices.find((x) => x.id === id);
        if (!inv) return;
        const amount = Number(inv.amount) || 0;
        const received = invoiceReceived(inv);

        modal({
          title: "Record payment",
          note: `<strong>${escapeHtml(inv.label || "Invoice")}</strong> for ${escapeHtml(S.orgById[inv.orgId]?.name || inv.orgId)} — ${escapeHtml(formatINR(amount))}.
                 By hand is for cash and bank transfers; anything paid online should come through <em>Sync payments</em>, which asks Razorpay what it was actually paid.`,
          submitLabel: "Record",
          body: `
            <div class="bm-field">
              <label for="f-pay-amount">Total received so far (Rs)</label>
              <input id="f-pay-amount" type="number" min="0" step="500" max="${amount}" value="${received || amount}" required />
              <span class="bm-row-sub">
                The running total, not just today's payment — so typing it twice cannot double it.
                ${received ? `Currently recorded: ${escapeHtml(formatINR(received))}.` : ""}
                Enter 0 to put it back to unpaid.
              </span>
            </div>
            <p class="bm-hint" id="f-pay-preview"></p>`,
          onReady: (form) => {
            const draw = () => {
              const v = Number(form.querySelector("#f-pay-amount").value) || 0;
              const left = Math.max(0, amount - v);
              form.querySelector("#f-pay-preview").innerHTML =
                v <= 0 ? "Marks this invoice <strong>unpaid</strong>."
                : v >= amount ? "Settles this invoice <strong>in full</strong>."
                : `Leaves <strong>${escapeHtml(formatINR(left))}</strong> outstanding. The client sees the balance, not a paid invoice.`;
            };
            form.addEventListener("input", draw);
            draw();
          },
          onSubmit: async () => {
            const r = await recordPayment(id, Number($("f-pay-amount").value));
            await logActivity("invoice.payment",
              `Recorded by hand: ${inv.label || id} for ${S.orgById[inv.orgId]?.name || inv.orgId} — ` +
              `${formatINR(r.received)} of ${formatINR(r.amount)}${r.outstanding ? `, ${formatINR(r.outstanding)} still outstanding` : ", settled in full"}`,
              { orgId: inv.orgId || null, target: inv.label || id, amount: r.received });
          },
        });
      }

      RENDER.money = () => {
        const m = money();
        const studio = studioOrg(S.orgs);
        const payee = studioPayee(studio);
        const clients = S.orgs.filter((o) => o.kind === "client" && o.status === "active");
        const sorted = [...S.invoices].sort((a, b) => {
          const rank = (x) => (x.status === "paid" ? 1 : 0);
          if (rank(a) !== rank(b)) return rank(a) - rank(b);
          return (a.dueAt?.toMillis?.() || 0) - (b.dueAt?.toMillis?.() || 0);
        });

        $("view-money").innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>Money</h2>
              <p>Signed retainers and every invoice ever raised. Nothing on this screen counts a
                 proposal, and nothing counts an invoice until it is actually paid.</p>
            </div>
            <div class="bm-view-actions">
              <button type="button" class="bm-btn bm-btn--sm" data-new="invoice">Raise invoice</button>
            </div>
          </div>

          <div class="bm-tiles">
            <div class="bm-tile">
              <p class="bm-tile-label">Signed MRR</p>
              <p class="bm-tile-value ${m.mrr >= BREAK_EVEN_MONTHLY ? "bm-tile-value--green" : "bm-tile-value--red"}" id="bm-mrr">${escapeHtml(inr(m.mrr))}</p>
              <p class="bm-tile-sub">Break-even is ${escapeHtml(inr(BREAK_EVEN_MONTHLY))}/month</p>
            </div>
            <div class="bm-tile">
              <p class="bm-tile-label">Still owed</p>
              <p class="bm-tile-value ${m.unpaid.length ? "bm-tile-value--red" : ""}">${escapeHtml(inr(m.unpaidTotal))}</p>
              <p class="bm-tile-sub">${S.invoices.length === 0
                ? "No invoices raised yet — empty, not settled."
                : `${m.unpaid.length} of ${S.invoices.length} not settled in full`}</p>
            </div>
            <div class="bm-tile">
              <p class="bm-tile-label">Collected</p>
              <p class="bm-tile-value">${escapeHtml(inr(m.paidTotal))}</p>
              <p class="bm-tile-sub">${S.invoices.length === 0 ? "Nothing raised yet" : "Money actually received, part payments included"}</p>
            </div>
          </div>

          <div class="bm-panel bm-panel--flush">
            <div class="bm-panel-head">
              <div><h3>Invoice ledger</h3>
                <p>Marking one paid by hand is for cash and bank transfers. For anything paid
                   online use Sync payments — it asks Razorpay what it was actually paid.</p></div>
            </div>
            <div class="bm-list" id="bm-inv-list">
              ${sorted.length ? sorted.map(invoiceRow).join("")
                : `<p class="bm-empty" style="padding:0 22px 22px;">No invoices raised yet.</p>`}
            </div>
          </div>

          <div class="bm-panel">
            <div class="bm-panel-head"><div><h3>Payment details on your invoices</h3>
              <p>Printed at the foot of every invoice. Stored in your database,
                 <strong>not in the code</strong> — this repository is public, and an account
                 number committed to it would be there permanently for anyone to read.
                 Leave it blank and invoices simply omit the block.</p></div></div>
            ${studio ? `
              <div class="bm-field">
                <label for="f-bank-holder">Account name</label>
                <input id="f-bank-holder" value="${escapeHtml(studio.bankHolder || "")}" placeholder="As it appears on the account" />
              </div>
              <div class="bm-field">
                <label for="f-bank-account">Account number</label>
                <input id="f-bank-account" inputmode="numeric" autocomplete="off"
                  value="${escapeHtml(studio.bankAccount || "")}" />
              </div>
              <div class="bm-field">
                <label for="f-bank-ifsc">IFSC</label>
                <input id="f-bank-ifsc" autocapitalize="characters" spellcheck="false"
                  value="${escapeHtml(studio.bankIfsc || "")}" placeholder="e.g. HDFC0001234" />
              </div>
              <div class="bm-field">
                <label for="f-bank-name">Bank</label>
                <input id="f-bank-name" value="${escapeHtml(studio.bankName || "")}" placeholder="Your bank" />
              </div>
              <button type="button" class="bm-btn bm-btn--sm" data-save-payee="${escapeHtml(studio.id)}">Save payment details</button>
              <p class="bm-status" id="bm-payee-status" hidden></p>
              <p class="bm-hint" style="margin-top:10px;">
                ${payee ? "Invoices are printing these." : "Incomplete — invoices are printing no payment block at all, which is better than printing a half-filled one."}
              </p>`
              : `<p class="bm-empty">No studio organisation exists yet, so there is nowhere to keep these.
                   Seed the database once from Tools, or add an organisation with kind
                   <code>studio</code>.</p>`}
          </div>

          <div class="bm-panel bm-panel--flush">
            <div class="bm-panel-head"><div><h3>Retainers</h3>
              <p>Proposals are shown faded and are never summed into MRR.</p></div></div>
            <div class="bm-list">
              ${clients.length ? clients.map((o) => {
                const signed = o.retainerStatus === "signed";
                return `<button type="button" class="bm-listrow" data-org="${escapeHtml(o.id)}" style="${signed ? "" : "opacity:.62"}">
                  <span class="bm-listrow-main">
                    <span class="bm-listrow-title">${escapeHtml(o.name)}</span>
                    ${o.note ? `<span class="bm-listrow-sub">${escapeHtml(o.note)}</span>` : ""}
                  </span>
                  <span class="bm-listrow-right">
                    <span>${escapeHtml(formatINR(o.retainer))}</span>
                    <span class="bm-pill ${signed ? "bm-pill--green" : o.retainerStatus === "proposed" ? "bm-pill--amber" : "bm-pill--muted"}">${escapeHtml(o.retainerStatus || "none")}</span>
                    ${chev}
                  </span>
                </button>`;
              }).join("")
                : `<p class="bm-empty" style="padding:0 22px 22px;">No client organisations yet.</p>`}
            </div>
          </div>`;

        mo.tiles($("view-money").querySelectorAll(".bm-tile"));
        mo.rows($("bm-inv-list").children);
      };

      /* ══════════════════════════════════════════════════════════
         ACCESS
         ══════════════════════════════════════════════════════════ */


      /* ══════════════════════════════════════════════════════════
         ACTIVITY — the audit log (§9 item 4)
         ══════════════════════════════════════════════════════════ */

      const stamp = (ts) => {
        if (!ts) return "—";
        const d = typeof ts.toDate === "function" ? ts.toDate() : new Date(ts);
        return Number.isNaN(d.getTime()) ? "—"
          : d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      };

      /* ══════════════════════════════════════════════════════════
         UPDATES — every client, one screen, one pass

         The single thing that was asked for: "update every client at once".
         Before this, telling six clients where things stood meant opening six
         drawers, which is why it stopped happening and why "any update?" kept
         arriving on WhatsApp instead.

         One textarea per live project. Save All writes them together. Each row
         then offers the same text as a WhatsApp message, because that is where
         the client actually reads things — the portal is where they can go and
         check, not where they get told.

         Deliberately NOT auto-sending. The link opens the compose window with
         the text in it and the studio presses send; a message that went out
         without being read once is how a wrong number gets a client's update.
         ══════════════════════════════════════════════════════════ */
      RENDER.updates = () => {
        const live = updatableProjects(S.projects, S.orgs);
        const rows = live.map((p) => {
          const org = S.orgById[p.orgId] || {};
          const wa = waNumber(org.contactPhone);
          const when = p.updateAt ? daysSince(p.updateAt) : null;
          const stale = when === null || when >= 7;
          return `
            <div class="bm-upd" data-upd-row="${escapeHtml(p.id)}">
              <div class="bm-upd-head">
                <div>
                  <p class="bm-upd-client">${escapeHtml(org.name || p.orgId)}</p>
                  <p class="bm-upd-project">${escapeHtml(p.name || "Untitled project")}</p>
                </div>
                <span class="bm-pill ${stale ? "bm-pill--amber" : "bm-pill--green"}">${
                  when === null ? "never updated" : when === 0 ? "today" : `${when}d ago`
                }</span>
              </div>
              <textarea class="bm-upd-text" data-upd="${escapeHtml(p.id)}" rows="2"
                placeholder="What moved this week, in one line. They read this, so write it to them."
                aria-label="Update for ${escapeHtml(org.name || "client")}">${escapeHtml(p.updateText || "")}</textarea>
              <div class="bm-upd-foot">
                ${wa
                  ? `<button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-upd-wa="${escapeHtml(p.id)}">Send on WhatsApp</button>`
                  : `<span class="bm-hint">No number on this client — add one in their record to message them.</span>`}
              </div>
            </div>`;
        }).join("");

        $("view-updates").innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>Updates</h2>
              <p>Every live project, one line each, sent together. This is the whole reason
                 the portal stops being the thing you have to remember to open on their
                 behalf — write it here once and it is on their screen and in their chat.</p>
            </div>
            <div class="bm-view-actions">
              <button type="button" class="bm-btn bm-btn--sm" id="bm-upd-save">Save all</button>
            </div>
          </div>
          <p class="bm-status" id="bm-upd-status" hidden></p>
          ${live.length
            ? `<div class="bm-upd-list">${rows}</div>`
            : `<div class="bm-panel"><p class="bm-empty">No live projects, so there is nobody to update.
                 That is an empty database, not a quiet week — start an engagement from Clients.</p></div>`}`;

        mo.rows($("view-updates").querySelectorAll(".bm-upd"));
      };

      /* ══════════════════════════════════════════════════════════
         TEAM — the screen that makes the five roles usable

         firestore.rules has enforced the Section 3 matrix since it was
         published. Until this screen existed, every role had to be created by
         hand-editing documents in the Firebase Console — enforced and
         unusable at the same time.

         Three things and no more: who someone is, what they may see, and what
         they cost. Assignment to engagements is NOT here; it lives on the
         project, because that is where you are when you decide it.

         Rates are loaded separately and lazily. They are their own collection
         precisely because Firestore cannot withhold a field, so reading them
         is a second request — and if the rules deny it, that must take down
         this panel and not the whole CRM.
         ══════════════════════════════════════════════════════════ */
      RENDER.team = async () => {
        const staff = staffUsers(S.users);
        const el = $("view-team");

        el.innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>Team</h2>
              <p>Who works here and what each of them may see. The boundary is enforced by the
                 database, not by this screen — if a role is set here, it is true everywhere.</p>
            </div>
            <div class="bm-view-actions">
              <button type="button" class="bm-btn bm-btn--sm" id="bm-team-add">Add someone</button>
            </div>
          </div>

          <div class="bm-panel bm-panel--flush">
            <div class="bm-panel-head"><div><h3>People</h3>
              <p>The CEO is not listed: that role is a claim on your sign-in token rather than a
                 record, which is what stops the first admin needing to already be one.</p></div></div>
            <div class="bm-list" id="bm-team-list">
              ${staff.length ? staff.map((u) => {
                const r = STAFF_ROLES.find((x) => x.id === u.role);
                const projects = S.projects.filter((p) => onTeam(p, u.id));
                return `<div class="bm-listrow" style="cursor:default;">
                  <span class="bm-listrow-main">
                    <span class="bm-listrow-title">${escapeHtml(u.name || u.id)}</span>
                    <span class="bm-listrow-sub">${escapeHtml(r?.blurb || u.role)}</span>
                    <span class="bm-listrow-sub">${projects.length
                      ? "On: " + escapeHtml(projects.map((p) => p.name || p.id).join(", "))
                      : "On no engagements yet — so they can reach nothing. Assign them from a project."}</span>
                  </span>
                  <span class="bm-listrow-right">
                    <span class="bm-pill bm-pill--muted">${escapeHtml(r?.label || u.role)}</span>
                    <span class="bm-rate" data-rate-for="${escapeHtml(u.id)}">—</span>
                    <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-team-edit="${escapeHtml(u.id)}">Edit</button>
                    <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-team-remove="${escapeHtml(u.id)}">Remove</button>
                  </span>
                </div>`;
              }).join("")
                : `<p class="bm-empty" style="padding:0 24px 24px;">Nobody here yet. That is an empty
                   list, not a solo studio — add whoever is already working with you.</p>`}
            </div>
          </div>

          <div class="bm-panel">
            <div class="bm-panel-head"><div><h3>How access actually works</h3></div></div>
            <ul class="bm-hint" style="padding-left:18px;margin:0;">
              <li><strong>A role on its own grants almost nothing.</strong> Partners and collaborators
                  reach an engagement only when they are on its team. A project with nobody assigned
                  is yours alone — silence denies rather than admits.</li>
              <li><strong>Rates are visible to you and Finance.</strong> A collaborator sees their own.
                  A partner sees none, including their own — that is the matrix as written.</li>
              <li><strong>No password is ever typed here.</strong> Create the account in the Firebase
                  Console, copy the UID, paste it. The password exists there and nowhere else.</li>
              <li><strong>Removing someone deletes their access immediately</strong> — every rule
                  resolves through that record. It does not delete their Firebase account.</li>
            </ul>
          </div>`;

        mo.rows($("bm-team-list").children);

        /* Lazily, and failing alone. If the rules deny this the panel says so
           instead of the whole view dying — the same reason Activity is
           loaded separately. */
        try {
          const rates = await getRates();
          const by = Object.fromEntries(rates.map((r) => [r.id, r]));
          for (const node of el.querySelectorAll("[data-rate-for]")) {
            const r = by[node.dataset.rateFor];
            node.textContent = r ? formatINR(r.rate) + "/day" : "no rate set";
          }
        } catch (err) {
          for (const node of el.querySelectorAll("[data-rate-for]")) node.textContent = "rate hidden";
        }
      };

      /* Loaded lazily, NOT in loadAll(). If the rules for this collection are
         not published yet the read is denied, and a denied read inside the
         boot fetch would take the whole CRM down with it. Here it takes down
         one panel, which then explains itself. */
      RENDER.activity = () => {
        $("view-activity").innerHTML = `
          <div class="bm-view-head">
            <div>
              <h2>Activity</h2>
              <p>Every action that changes money, access or delivery status, as it happened.
                 Append-only — entries cannot be edited or deleted by anyone, including you.
                 That is what makes it worth reading.</p>
            </div>
            <div class="bm-view-actions">
              <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" id="bm-act-reload">Reload</button>
            </div>
          </div>
          <div class="bm-panel bm-panel--flush">
            <div class="bm-list" id="bm-activity-list">
              <p class="bm-empty" style="padding:22px;">Loading…</p>
            </div>
          </div>`;

        $("bm-act-reload").addEventListener("click", () => RENDER.activity());

        getActivity(200).then((rows) => {
          const el = $("bm-activity-list");
          if (!el) return;

          /* An empty log is NOT a quiet week — it may be a log that has never
             recorded anything because nothing has happened SINCE it was
             switched on. Saying so is the same rule as everywhere else on this
             screen: empty is not the same as done. */
          if (!rows.length) {
            el.innerHTML = `<p class="bm-empty" style="padding:22px;">
              No entries yet. The log only records what happens from the moment its rules
              go live — it cannot reconstruct anything that happened before that, and it is
              not claiming nothing did.
            </p>`;
            return;
          }

          el.innerHTML = rows.map((r) => `
            <div class="bm-listrow" style="cursor:default;">
              <span class="bm-listrow-main">
                <span class="bm-listrow-title">${escapeHtml(r.summary || r.action || "—")}</span>
                <span class="bm-listrow-sub">${escapeHtml(r.actorEmail || r.actor || "unknown")} · ${escapeHtml(stamp(r.at))}</span>
              </span>
              <span class="bm-listrow-right">
                <span class="bm-pill bm-pill--muted">${escapeHtml(r.action || "—")}</span>
                ${r.amount ? `<span class="bm-pill bm-pill--muted">${escapeHtml(formatINR(r.amount))}</span>` : ""}
              </span>
            </div>`).join("");
          mo.rows(el.children);
        }).catch((err) => {
          const el = $("bm-activity-list");
          if (!el) return;
          /* Detect on the SDK's error CODE, not on its message. An earlier
             version matched /permission|insufficient/ against the message and
             missed the real one: the emulator says "false for 'list' @ L62"
             (L62 being the catch-all deny), which contains neither word. The
             code is the stable contract; the message is not. */
          const denied = err?.code === "permission-denied"
            || /permission|insufficient|false for/i.test(err?.message || "");
          /* Denied and empty must not look the same. A blank panel here would
             read as "nothing has happened" when the truth is "this cannot be
             read at all yet". */
          el.innerHTML = `<p class="bm-empty" style="padding:22px;">
            ${denied
              ? `<strong>The rules for this collection are not published yet.</strong><br>
                 Firestore is refusing the read, which is correct — <code>activity</code> is
                 denied by the catch-all until the updated <code>firestore.rules</code> is
                 published in the Firebase Console. Everything else on this screen works
                 normally; entries are being discarded rather than stored until then.`
              : escapeHtml("Could not read the log: " + (err?.message || err))}
          </p>`;
        });
      };

      /* ══════════════════════════════════════════════════════════
         OVERLAYS — drawer, modal, command palette
         ══════════════════════════════════════════════════════════ */

      let lastFocus = null;

      function closeOverlay() {
        const host = $("bm-overlay");
        const panel = host.querySelector(".bm-drawer, .bm-modal, .bm-cmd");
        const scrim = host.querySelector(".bm-drawer-scrim, .bm-modal-scrim, .bm-cmd-scrim");
        if (!panel && !scrim) return;
        const isDrawer = !!host.querySelector(".bm-drawer");
        const finish = () => { host.innerHTML = ""; lastFocus?.focus?.(); lastFocus = null; };
        if (isDrawer) mo.drawerOut(panel, scrim).then(finish);
        else finish();
      }

      function drawer({ title, sub, body }) {
        lastFocus = document.activeElement;
        $("bm-overlay").innerHTML = `
          <div class="bm-drawer-scrim" data-close></div>
          <aside class="bm-drawer" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
            <div class="bm-drawer-head">
              <div>
                <h3>${escapeHtml(title)}</h3>
                <p>${sub}</p>
              </div>
              <button type="button" class="bm-drawer-close" data-close aria-label="Close">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div class="bm-drawer-body">${body}</div>
          </aside>`;
        mo.drawerIn($("bm-overlay").querySelector(".bm-drawer"), $("bm-overlay").querySelector(".bm-drawer-scrim"));
        $("bm-overlay").querySelector(".bm-drawer-close")?.focus();
      }

      function modal({ title, note, body, submitLabel = "Save", onSubmit, onReady }) {
        lastFocus = document.activeElement;
        $("bm-overlay").innerHTML = `
          <div class="bm-modal-scrim" data-close-outside>
            <form class="bm-modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
              <h3>${escapeHtml(title)}</h3>
              <p class="bm-modal-note">${note}</p>
              ${body}
              <p class="bm-status" id="bm-modal-status" hidden></p>
              <div class="bm-modal-foot">
                <button type="button" class="bm-btn bm-btn--ghost bm-btn--sm" data-close>Cancel</button>
                <button type="submit" class="bm-btn bm-btn--sm">${escapeHtml(submitLabel)}</button>
              </div>
            </form>
          </div>`;
        const form = $("bm-overlay").querySelector("form");
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const st = $("bm-modal-status");
          const btn = form.querySelector('button[type="submit"]');
          btn.disabled = true;
          try {
            await onSubmit(form);
            closeOverlay();
            await refresh();
          } catch (err) {
            st.hidden = false;
            st.className = "bm-status bm-status--error";
            st.textContent = err?.message || String(err);
            btn.disabled = false;
          }
        });
        onReady?.(form);
        mo.popIn(form, $("bm-overlay").querySelector(".bm-modal-scrim"));
        form.querySelector("input, select")?.focus();
      }

      /* The "New" menu and the create forms. Each one states the rule it is
         about to apply rather than applying it silently. */
      const NEW_FORMS = {
        /* ONE SCREEN TO START AN ENGAGEMENT.
           This replaced seven steps across three screens — add client, add
           project, go to /quote, build the scope, save it back, return, stamp
           a schedule — every one of which was somewhere to stop halfway.

           Four answers: who, which deal, how much, how long. Everything else
           is derived by createEngagement() from rules the studio already
           follows, and the live preview at the bottom states exactly what is
           about to be created before anything is. */
        engagement: (opts = {}) => {
          /* Optionally opened FROM a lead. When it is, the name arrives filled
             in and the submit routes through convertLead(), which closes and
             links the lead in the same action — so winning a deal is one
             button and one form, not two records to keep in step by hand. */
          const lead = opts.lead || null;
          let deal = "then";
          const money = (v) => "Rs " + (Number(v) || 0).toLocaleString("en-IN");

          modal({
            title: lead ? `Win ${lead.name || "this lead"}` : "New engagement",
            note: lead
              ? "The lead's name, contact and source carry across. It comes off the board marked won, pointing at the client it became — its first-response time is kept, because that number is never recreatable."
              : "Four answers. The client, the projects, the 50/50 invoices and the schedule are all created from them.",
            submitLabel: "Create engagement",
            body: `
              <div class="bm-field">
                <label for="f-e-name">Client</label>
                <input id="f-e-name" placeholder="Nalanda Interiors" value="${escapeHtml(lead?.name || "")}" required />
              </div>

              <div class="bm-field">
                <label>Deal</label>
                <div class="bm-seg bm-seg--wrap" id="f-e-deal" role="group" aria-label="Deal type">
                  ${DEAL_TYPES.map((d) => `<button type="button" data-deal="${escapeHtml(d.id)}"
                     aria-pressed="${d.id === "then"}">${escapeHtml(d.label)}</button>`).join("")}
                </div>
                <span class="bm-row-sub" id="f-e-blurb"></span>
              </div>

              <div id="f-e-build">
                <div class="bm-field">
                  <label for="f-e-price">Project price (Rs, before GST)</label>
                  <input id="f-e-price" type="number" min="0" step="5000" placeholder="600000" />
                </div>
                <div class="bm-field">
                  <label for="f-e-weeks">Length (weeks)</label>
                  <input id="f-e-weeks" type="number" min="1" max="52" value="10" />
                </div>
                <div class="bm-field">
                  <label for="f-e-type">Kind of work (optional — stamps a schedule)</label>
                  <select id="f-e-type">
                    <option value="">Not set</option>
                    ${SERVICE_TYPES.map((t) => `<option value="${escapeHtml(t.id)}">${escapeHtml(t.label)}</option>`).join("")}
                  </select>
                </div>
              </div>

              <div id="f-e-ret">
                <div class="bm-field">
                  <label for="f-e-retainer">Monthly retainer (Rs)</label>
                  <input id="f-e-retainer" type="number" min="0" step="500" placeholder="25000" />
                </div>
                <label class="bm-mn-check" style="margin-bottom:6px;">
                  <input type="checkbox" id="f-e-signed" /> Already signed
                </label>
                <p class="bm-hint">Unticked it is recorded as <strong>proposed</strong> and counts as nothing.
                   Nothing on this form can quietly raise your MRR.</p>
              </div>

              <p class="bm-hint" id="f-e-preview" style="margin-top:14px;padding:12px;border:1px solid var(--bm-line);border-radius:10px;"></p>`,

            onReady: (form) => {
              const shape = () => DEAL_TYPES.find((d) => d.id === deal);
              const preview = () => {
                const sh = shape();
                const name = form.querySelector("#f-e-name").value.trim() || "This client";
                const price = Number(form.querySelector("#f-e-price").value) || 0;
                const wk = Number(form.querySelector("#f-e-weeks").value) || 0;
                const ret = Number(form.querySelector("#f-e-retainer").value) || 0;
                const signed = form.querySelector("#f-e-signed").checked;
                const end = new Date(Date.now() + wk * 7 * 86400000);
                const bits = [];
                if (sh.build && price > 0 && wk > 0) {
                  bits.push(`a <strong>${escapeHtml(money(price))}</strong> build over <strong>${wk} weeks</strong>`);
                  bits.push(`invoices ${escapeHtml(money(Math.round(price / 2)))} now and ${escapeHtml(money(price - Math.round(price / 2)))} due ${escapeHtml(end.toLocaleDateString("en-IN", { day: "numeric", month: "short" }))}`);
                  bits.push(`about <strong>${escapeHtml(money(Math.round(price / Math.max(1, (wk * 5) / 21.7))))}/month</strong> while it runs`);
                }
                if (sh.retainer && ret > 0) {
                  bits.push(`a ${escapeHtml(money(ret))}/month retainer, <strong>${signed ? "signed" : "proposed"}</strong>${signed ? "" : " — not counted yet"}`);
                }
                form.querySelector("#f-e-preview").innerHTML = bits.length
                  ? `Creates <strong>${escapeHtml(name)}</strong> with ${bits.join(", ")}.`
                  : "Fill in the amounts and this will say exactly what it is about to create.";
              };

              const sync = () => {
                const sh = shape();
                form.querySelector("#f-e-build").hidden = !sh.build;
                form.querySelector("#f-e-ret").hidden = !sh.retainer;
                form.querySelector("#f-e-blurb").textContent = sh.blurb;
                form.querySelectorAll("#f-e-deal button").forEach((b) => {
                  b.setAttribute("aria-pressed", String(b.dataset.deal === deal));

                preview();
              };

              form.querySelector("#f-e-deal").addEventListener("click", (e) => {
                const b = e.target.closest("[data-deal]");
                if (!b) return;
                deal = b.dataset.deal;
                mo.tap(b);
                sync();
              });
              form.addEventListener("input", preview);
              form.addEventListener("change", preview);
              sync();
            },

            onSubmit: async () => {
              const payload = {
                name: $("f-e-name").value,
                deal,
                price: $("f-e-price").value,
                weeks: $("f-e-weeks").value,
                retainer: $("f-e-retainer").value,
                retainerSigned: $("f-e-signed").checked,
                type: $("f-e-type").value || null,
              };
              const r = lead
                ? await convertLead(lead.id, payload)
                : await createEngagement(payload);
              if (lead) {
                await logActivity("lead.won",
                  `${lead.name || lead.id} became a client — ${SOURCE_LABEL[lead.source] || lead.source || "source not set"}`,
                  { orgId: r.orgId, target: lead.name || lead.id });
              }
              await logActivity("engagement.create",
                `New ${DEAL_TYPES.find((d) => d.id === deal).label.toLowerCase()}: ${$("f-e-name").value.trim()}`,
                { orgId: r.orgId, target: $("f-e-name").value.trim() });

        /* Add or edit a staff member. A UID, never a password (§4) — the
           account is made in the Firebase Console and the password lives
           there and nowhere else. */
        team: (opts = {}) => {
          const existing = opts.user || null;
          let role = existing?.role || "collaborator";
          modal({
            title: existing ? `Edit ${existing.name || existing.id}` : "Add someone to the team",
            note: existing
              ? "Changing a role changes what they can reach everywhere, immediately."
              : "Create the account in Firebase Console → Authentication → Add user, then paste its UID here. No password is typed into this app, ever.",
            submitLabel: existing ? "Save" : "Add to team",
            body: `
              <div class="bm-field">
                <label for="f-t-name">Name</label>
                <input id="f-t-name" value="${escapeHtml(existing?.name || "")}" placeholder="Who they are" required />
              </div>
              ${existing ? "" : `<div class="bm-field">
                <label for="f-t-uid">Firebase UID</label>
                <input id="f-t-uid" placeholder="Paste from Authentication → Users" required />
                <p class="bm-help">Not an email and not a password — the long identifier in the UID column.</p>
