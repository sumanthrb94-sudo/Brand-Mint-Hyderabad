<!doctype html>
<!--
  Slide template for the Instagram carousels. One slide per render; the
  renderer sets window.__SLIDE before paint.

  1080x1350 — 4:5, the tallest ratio the feed allows, so each slide takes the
  most screen it can on a phone.

  Type is set in the site's own faces, loaded from /fonts, so a carousel and
  the landing page it sends people to look like one studio. That is also why
  this is HTML rendered in Chromium rather than a generated image: a model
  cannot spell ₹14,999 reliably, and a wrong price in a post is a takedown
  rather than an edit.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Carousel slide</title>
<style>
  @font-face { font-family:"Plus Jakarta Sans"; src:url("/fonts/plus-jakarta-sans.woff2") format("woff2"); font-weight:200 800; font-display:block; }
  @font-face { font-family:"Inter"; src:url("/fonts/inter.woff2") format("woff2"); font-weight:100 900; font-display:block; }
  @font-face { font-family:"JetBrains Mono"; src:url("/fonts/jetbrains-mono.woff2") format("woff2"); font-weight:100 800; font-display:block; }
  /* JetBrains Mono ships no rupee; borrow Inter's for that one codepoint, or
     every price renders with a hole in the middle. */
  @font-face { font-family:"JetBrains Mono"; src:url("/fonts/inter.woff2") format("woff2"); unicode-range:U+20B9; font-weight:100 900; font-display:block; }

  :root{
    --paper:#f5f1ea; --ink:#0a0e0c; --muted:#5b625e;
    --mint:#10b981; --mint-deep:#047857; --mint-wash:#d6f5e6;
    --bm-ink:#0b1f1a; --bm-deep:#06140f; --cream:#f5f1ea; --emerald:#00c897; --gold:#c9a14a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;overflow:hidden;font-family:"Inter",sans-serif;
       color:var(--cream);background:var(--bm-deep);-webkit-font-smoothing:antialiased}

  /* Every slide is dark. The covers are dark and loud; a cream interior behind
     one reads as a different post entirely, and that drop is where the swipe
     stops. One ground throughout, with the gradient origin moved per slide so
     the set still has rhythm. */
  .slide{position:relative;width:1080px;height:1350px;padding:78px 68px;
         display:flex;flex-direction:column;color:var(--cream);
         background:radial-gradient(820px 620px at 86% 8%, #14352d, var(--bm-ink) 56%, var(--bm-deep))}
  .slide.dark{background:radial-gradient(760px 560px at 50% 22%, #14352d, var(--bm-ink) 58%, var(--bm-deep))}

  .kicker{font:700 22px/1.4 "Inter";letter-spacing:.2em;text-transform:uppercase;color:var(--emerald)}

  h1{font-family:"Plus Jakarta Sans";font-weight:700;letter-spacing:-.04em;line-height:.98;
     font-size:132px;margin-top:30px;text-wrap:balance}
  h1.sm{font-size:104px}
  h1 em{display:block;font-style:italic;font-weight:500;color:var(--emerald)}

  .body{margin-top:36px;font-size:36px;line-height:1.42;color:rgba(245,241,234,.78);max-width:24ch}

  ul{list-style:none;margin-top:52px;display:flex;flex-direction:column;gap:34px}
  li{display:flex;gap:26px;align-items:baseline;font-size:41px;line-height:1.26;
     font-weight:600;color:var(--cream)}
  li b{flex:none;font:700 52px/1 "JetBrains Mono";color:var(--emerald);
       letter-spacing:-.04em;min-width:88px}
  li span{flex:1}

  .price{font-family:"JetBrains Mono";font-weight:700;font-variant-numeric:tabular-nums;
         font-size:196px;letter-spacing:-.06em;line-height:.92;margin-top:34px;color:var(--emerald)}
  .price-sub{margin-top:20px;font:600 30px/1.4 "Inter";color:rgba(245,241,234,.66)}

  /* The content block is centred between the top padding and the footer
     rather than top-aligned. Top-aligned left a third of every slide empty
     under the headline, which reads as unfinished rather than spacious. */
  .main{flex:1;display:flex;flex-direction:column;justify-content:center}


  /* Full-bleed photograph with type over it — the scale-hook covers. A scrim
     top and bottom, because a headline sitting directly on a photograph is
     unreadable the moment the photograph changes. */
  /* Any slide carrying an img renders as a poster: subject in the top half,
     text on the bottom half under a scrim heavy enough to carry cream type
     over a real photograph. Lists and price slides never take one — four rows
     at 41px, or a price, over a photograph is a legibility gamble that is not
     worth taking for a picture. */
  .slide.photo{padding:0;background:#06140f}
  .photo .main{flex:none;margin-top:auto}
  /* scale(1.05) crops ~2.5% off every edge. Gemini keeps drawing a thin grey
     frame or matte into these plates whatever the prompt says, and one dark
     hairline along a slide edge is the kind of thing that only becomes obvious
     once it is posted. Cheaper to crop than to keep re-rolling. */
  .photo .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
  .photo .body{max-width:26ch}
  .photo .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(6,20,15,.40) 0%, rgba(6,20,15,.10) 24%,
               rgba(6,20,15,.50) 44%, rgba(6,20,15,.86) 64%,
               rgba(6,20,15,.95) 82%, rgba(6,20,15,.97) 100%)}
  .photo .inner{position:absolute;inset:0;padding:86px 78px;display:flex;flex-direction:column}
  .photo .kicker{color:var(--emerald)}
  .photo h1{color:var(--cream);font-size:104px;text-shadow:0 4px 40px rgba(0,0,0,.45)}
  .photo h1.sm{font-size:82px}
  .photo h1 em{color:var(--emerald)}
  .photo .body{color:rgba(245,241,234,.86);text-shadow:0 2px 20px rgba(0,0,0,.5)}
  .photo .foot{border-top-color:rgba(245,241,234,.26);color:var(--cream)}
  .photo .swipe,.photo .dot{color:var(--emerald)}

  /* ---------------------------- LOUD COVERS -------------------------------
     Explore is not a feed. A cover competes against "HOOK" at 1M views and
     "CONDENSED FONTS" in red on black, at thumbnail size, in a grid of nine.
     The rest of this file is the brand's indoor voice; this is the outdoor
     one. Loud cover, disciplined interior — which is exactly what every
     account in that grid actually does.

     No condensed face is licensed here, so scaleX fakes one. Real condensed
     type would be better; this is close enough at 1080px and costs nothing. */
  /* The ground is CSS, not a photograph. The AI cover plates were pulled
     because a grid full of generated imagery quietly argues that the
     portfolio is generated too — and real client screenshots are the one
     asset a competitor cannot fake. A gradient costs nothing, never renders
     a grey hairline, and at thumbnail size reads louder than a dark photo
     under a scrim did. .shot/.veil stay below for a REAL screenshot. */
  .slide.loud{padding:0;overflow:hidden;
    background:
      radial-gradient(760px 700px at 84% 12%, rgba(0,200,151,.30), transparent 62%),
      radial-gradient(900px 800px at 6% 96%, rgba(4,120,87,.34), transparent 66%),
      linear-gradient(168deg, #0e2b24 0%, var(--bm-ink) 46%, var(--bm-deep) 100%)}
  .loud .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
  /* A photo cover is a poster, not a plate with type on it: the face lives in
     the top half where nothing covers it, and the headline sits on the bottom
     half over a scrim heavy enough that the type never depends on what the
     photograph happens to be doing underneath. The old veil was built for the
     generated plates, which were already almost black — it is far too weak to
     carry cream type over a real photograph. */
  .loud .veil{position:absolute;inset:0;background:
      linear-gradient(180deg, rgba(6,20,15,.42) 0%, rgba(6,20,15,.12) 26%,
                      rgba(6,20,15,.55) 50%, rgba(6,20,15,.88) 74%,
                      rgba(6,20,15,.96) 100%)}
  /* Type anchored to the bottom, so it never rides up over the face. */
  .loud.has-img .mid{justify-content:flex-end}
  .loud.has-img .huge{font-size:206px}
  .loud.has-img .huge.two{font-size:186px}
  .loud.has-img .huge.three{font-size:146px}
  .loud.has-img .sub{margin-top:24px;font-size:34px;max-width:26ch;
     color:rgba(245,241,234,.94)}
  .loud .inner{position:absolute;inset:0;padding:56px 48px;display:flex;
               flex-direction:column}
  /* The type block takes every pixel between the tag and the footer and
     centres in it. Anchored top or bottom it left a third of the cover empty,
     which at thumbnail size just reads as a smaller post. */
  .loud .mid{flex:1;display:flex;flex-direction:column;justify-content:center}
  .loud .huge{font-family:"Plus Jakarta Sans";font-weight:800;color:var(--cream);
     font-size:248px;line-height:.82;letter-spacing:-.055em;text-transform:uppercase;
     /* -.055em tracking plus the .86 horizontal squeeze closes the word space
        to almost nothing, so "SAME FOUR" reads as one word at thumbnail size.
        Put back what the tracking takes out, on spaces only. */
     word-spacing:.16em;
     transform:scaleX(.86);transform-origin:left center;
     text-shadow:0 6px 60px rgba(0,0,0,.55)}
  .loud .huge.two{font-size:206px}
  .loud .huge.three{font-size:158px}
  /* nowrap is load-bearing, not cosmetic. Allowed to wrap, a too-long line
     silently becomes two lines of the wrong size and every measurement below
     reports it as fitting — so the auto-fit never fires and the guard never
     trips. Forced onto one line it overflows instead, which is measurable. */
  .loud .huge .ln{display:block;white-space:nowrap}
  .loud .huge em{font-style:normal;color:var(--emerald);display:block}
  /* The price runs in the mono face — tabular figures, and the rupee is
     borrowed from Inter above so it does not render as a hole. */
  .loud .huge.num{font-family:"JetBrains Mono";font-weight:700;letter-spacing:-.06em}
  .loud .tag{align-self:flex-start;background:var(--emerald);color:var(--bm-deep);
     font:800 30px/1 "Plus Jakarta Sans";letter-spacing:.02em;text-transform:uppercase;
     padding:16px 24px;border-radius:10px;transform:rotate(-2deg)}
  .loud .sub{margin-top:28px;font:600 36px/1.32 "Inter";color:var(--cream);max-width:24ch;
     text-shadow:0 2px 24px rgba(0,0,0,.6)}
  .loud .foot{border-top-color:rgba(245,241,234,.3);color:var(--cream)}
  .loud .swipe,.loud .dot{color:var(--emerald)}
  /* Cream variant — the "BRANDS THAT OWN RED" treatment. */
  .slide.loud.light{
    background:
      radial-gradient(820px 720px at 88% 8%, rgba(16,185,129,.20), transparent 60%),
      radial-gradient(760px 700px at 4% 100%, rgba(201,161,74,.16), transparent 64%),
      linear-gradient(172deg, #fbf8f2 0%, var(--paper) 52%, #e9e2d6 100%)}
  .loud.light .huge{color:var(--ink);text-shadow:none}
  .loud.light .huge em{color:var(--mint-deep)}
  .loud.light .sub{color:var(--muted);text-shadow:none}
  .loud.light .foot{border-top-color:rgba(10,14,12,.18);color:var(--ink)}
  .loud.light .swipe,.loud.light .dot{color:var(--mint-deep)}

  .foot{display:flex;align-items:center;justify-content:space-between;
        padding-top:30px;border-top:1px solid rgba(245,241,234,.2);font-size:24px}
  .brand{display:flex;align-items:center;gap:14px;font-family:"Plus Jakarta Sans";
         font-weight:600;font-size:28px;letter-spacing:-.02em;word-spacing:.12em}
  .mark{width:46px;height:46px;border-radius:12px;display:block}
  .swipe{font:600 26px/1 "JetBrains Mono";letter-spacing:.08em;color:var(--emerald)}
  .dot{font:600 24px/1 "JetBrains Mono";color:rgba(245,241,234,.6)}
</style>
</head>
<body>
<div class="slide" id="slide"></div>
<script>
  const S = window.__SLIDE || { kind: "cover", head: "No slide data" };
  const esc = (t) => String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  const MARK = `<svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7CF6C8"/><stop offset="100%" stop-color="#10B981"/>
    </linearGradient></defs>
    <rect width="32" height="32" rx="8" fill="url(#g)"/>
    <path d="M9 22V10l7 6 7-6v12" stroke="#0b1f1a" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;

  // Cover and CTA carry the dark ground, so a carousel opens and closes on the
  // brand colour and the middle stays light and readable.
  const dark = S.kind === "cover" || S.kind === "cta";
  const el = document.getElementById("slide");
  if (dark) el.classList.add("dark");
  // "photo" survives as a kind for the sets that already use it, but an img on
  // a statement or a cta now turns that slide into a poster too — which is the
  // only reason 93 of 109 slides were type-only.
  const poster = S.kind === "photo" || (S.img && S.kind !== "loud");
  if (poster) el.classList.add("photo");
  if (S.kind === "loud") {
    el.classList.add("loud");
    if (S.light) el.classList.add("light");
    if (S.img) el.classList.add("has-img");
  }

  let mid = "";
  if (S.kind === "list") {
    mid = "<ul>" + (S.items || []).map((t, i) =>
      `<li><b>${String(i + 1).padStart(2, "0")}</b><span>${esc(t)}</span></li>`).join("") + "</ul>";
  } else if (S.kind === "price") {
    mid = `<div class="price">${esc(S.price)}</div>
           <div class="price-sub">${esc(S.sub)}</div>
           ${S.body ? `<p class="body">${esc(S.body)}</p>` : ""}`;
  } else if (S.body) {
    mid = `<p class="body">${esc(S.body)}</p>`;
  }

  // The headline runs smaller when it is long enough to wrap past three lines
  // at full size — measured on the rendered slide, not guessed from a count.
  const headClass = (S.head || "").length > 26 ? "sm" : "";

  const shell = (inner) => poster && S.img
    ? `<img class="shot" src="${S.img}" alt=""><div class="scrim"></div><div class="inner">${inner}</div>`
    : inner;

  // The loud cover ignores the shared layout entirely — it is one block of
  // type and nothing else, which is the whole point of it.
  if (S.kind === "loud") {
    const words = (S.huge || "").split("|");
    const size = words.length >= 3 ? "three" : words.length === 2 ? "two" : "";
    const body = `
      ${S.img ? `<img class="shot" src="${S.img}" alt=""><div class="veil"></div>` : ""}
      <div class="inner">
        <div>${S.tag ? `<span class="tag">${esc(S.tag)}</span>` : ""}</div>
        <div class="mid">
          <div class="huge ${size} ${S.num ? "num" : ""}">${
            words.map((w, i) => i === words.length - 1 && S.accent
              ? `<em class="ln">${esc(w)}</em>`
              : `<span class="ln">${esc(w)}</span>`).join("")}</div>
          ${S.sub ? `<p class="sub">${esc(S.sub)}</p>` : ""}
        </div>
        <div class="foot">
          <span class="brand">${MARK} Brand Mint</span>
          ${S.foot ? `<span class="swipe">${esc(S.foot)}</span>`
                   : `<span class="dot">${esc(S.n || "")} / ${esc(S.of || "")}</span>`}
        </div>
      </div>`;
    el.innerHTML = body;

    // Shrink the headline until every line fits between the inner padding.
    // The three size classes are a starting guess; the real width depends on
    // which letters are in the word (a W at weight 800 is nearly twice an I),
    // so guessing from a character count is how a cover ships with its last
    // letters sliced off. Measured with a Range, because .ln is display:block
    // and therefore always exactly as wide as its parent no matter how far
    // the letters run past it. Fonts must be loaded first or every line
    // measures at the fallback face's width.
    document.fonts.ready.then(() => {
      const huge = el.querySelector(".huge");
      const inner = el.querySelector(".inner");
      if (!huge || !inner) { window.__FIT_DONE = true; return; }
      const cs = getComputedStyle(inner);
      const limit = inner.getBoundingClientRect().width
        - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const widest = () => {
        let w = 0;
        for (const ln of huge.querySelectorAll(".ln")) {
          const r = document.createRange();
          r.selectNodeContents(ln);
          for (const rc of r.getClientRects()) w = Math.max(w, rc.width);
        }
        return w;
      };
      let size = parseFloat(getComputedStyle(huge).fontSize);
      while (size > 96 && widest() > limit) {
        size -= 3;
        huge.style.fontSize = size + "px";
      }
      window.__FIT_DONE = true;
    });
  } else {

  el.innerHTML = shell(`
    <div class="main">
      ${S.kicker ? `<p class="kicker">${esc(S.kicker)}</p>` : ""}
      <h1 class="${headClass}">${esc(S.head)}${S.em ? `<em>${esc(S.em)}</em>` : ""}</h1>
      ${mid}
    </div>
    <div class="foot">
      <span class="brand">${MARK} Brand Mint</span>
      ${S.foot ? `<span class="swipe">${esc(S.foot)}</span>`
               : `<span class="dot">${esc(S.n || "")} / ${esc(S.of || "")}</span>`}
    </div>`);
    window.__FIT_DONE = true;
  }
</script>
</body>
</html>
