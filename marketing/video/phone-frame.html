<!doctype html>
<!--
  Source for assets/phone-frame-9x16.png — the device frame the real screen
  recording plays inside.

  The SCREEN AREA IS TRANSPARENT and everything else is opaque, so the compose
  step is a single overlay: screen footage on the bottom layer, this on top.
  The cutout is punched with an SVG mask rather than a transparent <div>,
  because a div with background:transparent still inherits whatever is painted
  behind it in the same stacking context.

  Geometry is fixed and the compose script depends on it:
      canvas  1080 x 1920
      screen   704 x 1524  at (188, 210)
  Change these and change SCREEN_* in cut-screen.sh to match.

  Render:  NODE_PATH=$(npm root -g) node marketing/video/render-frame.cjs
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Phone frame</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- The brand ground behind the device. -->
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%"   stop-color="#14352d"/>
      <stop offset="62%"  stop-color="#0b1f1a"/>
      <stop offset="100%" stop-color="#06140f"/>
    </radialGradient>

    <!-- A soft mint bloom behind the handset, so it sits in light rather than
         on a flat colour. -->
    <radialGradient id="bloom" cx="50%" cy="42%" r="50%">
      <stop offset="0%"   stop-color="#00c897" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00c897" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3c4a44"/>
      <stop offset="38%"  stop-color="#151d1a"/>
      <stop offset="72%"  stop-color="#2a3531"/>
      <stop offset="100%" stop-color="#101715"/>
    </linearGradient>

    <filter id="drop" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <!-- White shows the frame, black punches the hole for the screen. -->
    <mask id="cut">
      <rect width="1080" height="1920" fill="#fff"/>
      <rect x="188" y="210" width="704" height="1524" rx="46" ry="46" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#cut)">
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <rect width="1080" height="1920" fill="url(#bloom)"/>

    <!-- Device body, a little larger than the screen on every side. -->
    <g filter="url(#drop)">
      <rect x="168" y="190" width="744" height="1564" rx="66" ry="66" fill="url(#edge)"/>
      <rect x="176" y="198" width="728" height="1548" rx="58" ry="58" fill="#0a0f0d"/>
    </g>

    <!-- Side buttons, the detail that stops it reading as a rectangle. -->
    <rect x="164" y="470" width="6" height="64"  rx="3" fill="#2e3a35"/>
    <rect x="164" y="566" width="6" height="110" rx="3" fill="#2e3a35"/>
    <rect x="164" y="700" width="6" height="110" rx="3" fill="#2e3a35"/>
    <rect x="910" y="620" width="6" height="150" rx="3" fill="#2e3a35"/>
  </g>

  <!-- Drawn after the mask so they sit ON the screen, not behind it. -->
  <rect x="452" y="232" width="176" height="30" rx="15" fill="#0a0f0d"/>
  <rect x="470" y="1700" width="140" height="6" rx="3" fill="#0a0f0d" opacity="0.5"/>
</svg>
</body>
</html>
