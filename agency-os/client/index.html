<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Brand Mint — Custom ecommerce stores, built in 8 weeks · Hyderabad</title>
    <meta name="description" content="Custom ecommerce stores built end to end in Hyderabad — catalogue, cart, checkout, Razorpay with COD, and an admin you actually run the business from. Fixed scope, fixed price, agreed in writing." />
    <meta name="theme-color" content="#0b1f1a" />
    <link rel="canonical" href="https://brand-mint-sdmk.vercel.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Social cards. jpg rather than webp: several scrapers, WhatsApp among
         them, still will not render a webp preview. -->
    <meta property="og:site_name" content="Brand Mint" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brand-mint-sdmk.vercel.app/" />
    <meta property="og:title" content="Brand Mint — Custom ecommerce stores, built in 8 weeks" />
    <meta property="og:description" content="Custom ecommerce stores built end to end in Hyderabad — catalogue, cart, checkout, Razorpay with COD, and an admin you actually run the business from. Fixed scope, fixed price, agreed in writing." />
    <meta property="og:image" content="https://brand-mint-sdmk.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Brand Mint — Hyderabad's premium digital studio." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brand Mint — Custom ecommerce stores, built in 8 weeks" />
    <meta name="twitter:description" content="Custom ecommerce stores built end to end in Hyderabad — catalogue, cart, checkout, Razorpay with COD, and an admin you actually run the business from. Fixed scope, fixed price, agreed in writing." />
    <meta name="twitter:image" content="https://brand-mint-sdmk.vercel.app/og-image.jpg" />
    <!-- Search Console. Ships only when VITE_GSC_VERIFICATION is set; the build
         strips the tag otherwise so no empty content attribute goes out. -->
    <meta name="google-site-verification" content="%VITE_GSC_VERIFICATION%" />
    <!-- Fonts, loaded without blocking the first paint.

         These used to be an `@import` at the top of index.css, which is the
         worst place for them: the browser cannot even discover the request
         until it has downloaded and parsed the app stylesheet, so the font CSS
         and then the font files are two further round trips stacked in series
         ahead of any pixel being drawn. Here they resolve in parallel, and
         `media="print"` means the stylesheet never blocks rendering at all —
         `display=swap` in the URL renders fallback text immediately and swaps
         when the face arrives. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" /></noscript>

    <!-- The tag scripts are third-party and render-blocking if resolved late. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.clarity.ms" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
