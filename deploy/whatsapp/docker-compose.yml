# Evolution API sized for a 1 GB GCP e2-micro: no Redis, Postgres capped.
# On a 4 GB box you can re-enable the cache and lift the Postgres limits.
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    depends_on: [postgres]
    environment:
      - SERVER_URL=https://${WA_HOST}
      - AUTHENTICATION_API_KEY=${EVO_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evo:${PG_PASS}@postgres:5432/evolution
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${WEBHOOK_URL}
      - CONFIG_SESSION_PHONE_CLIENT=BrandMint
    volumes:
      - evo_instances:/evolution/instances   # the WhatsApp session. Never drop this.
    expose: ["8080"]                          # docker network only, never the world

  postgres:
    image: postgres:16-alpine
    restart: always
    command: >
      postgres -c shared_buffers=96MB -c max_connections=20
               -c work_mem=2MB -c maintenance_work_mem=32MB
    environment:
      - POSTGRES_USER=evo
      - POSTGRES_PASSWORD=${PG_PASS}
      - POSTGRES_DB=evolution
    volumes: [pg:/var/lib/postgresql/data]

  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      - WA_HOST=${WA_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [evolution]

volumes: { evo_instances: , pg: , caddy_data: , caddy_config: }
