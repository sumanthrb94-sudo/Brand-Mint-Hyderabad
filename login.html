<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f1a" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Sign in — Brand Mint</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0a0e0c; --ink-2: #3a423e; --muted: #5b625e; --faint: #6f7672;
        --line: rgba(10,14,12,.12); --mint: #10b981; --mint-deep: #047857; --mint-wash: #e6f7f0;
        --display: "Plus Jakarta Sans", system-ui, sans-serif;
        --sans: "Inter", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 32px 20px; font-family: var(--sans); color: var(--ink);
        background:
          radial-gradient(900px 600px at 15% -10%, rgba(16,185,129,.16), transparent 60%),
          #f5f1ea;
      }
      .card {
        width: 100%; max-width: 460px; background: #fff;
        border: 1px solid var(--line); border-radius: 24px; padding: 38px 34px 30px;
        box-shadow: 0 30px 80px rgba(11,31,26,.12);
      }
      .mark { display: flex; align-items: center; gap: 10px; font: 700 17px var(--display); letter-spacing: -.02em; margin-bottom: 24px; }
      .mark .bm-mark { width: 30px; height: 30px; display: block; }
      h1 { font: 600 27px/1.15 var(--display); letter-spacing: -.025em; margin: 0 0 8px; }
      p.sub { margin: 0 0 22px; color: var(--muted); font-size: 14.5px; line-height: 1.55; }

      .tier {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 12px 14px; border-radius: 13px; margin-bottom: 20px;
        background: var(--mint-wash); border: 1px solid #b8e8d3;
      }
      .tier b { font-family: var(--display); font-size: 15px; }
      .tier small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
      .tier .price { font: 600 15px var(--mono); color: var(--mint-deep); white-space: nowrap; }
      .tier[hidden] { display: none; }

      .btn {
        width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 13px 18px; border-radius: 12px; font: 600 15px/1.3 var(--sans); text-align: center; cursor: pointer;
        border: 1px solid var(--line); background: #fff; color: var(--ink);
        transition: border-color .15s, box-shadow .15s, transform .08s;
      }
      .btn:hover { border-color: #b9c8b8; box-shadow: 0 6px 20px rgba(11,31,26,.08); }
      .btn:active { transform: translateY(1px); }
      .btn[disabled] { opacity: .55; cursor: not-allowed; }
      :focus-visible { outline: 2px solid var(--mint-deep); outline-offset: 3px; border-radius: 4px; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

      .consent { margin: 16px 0 4px; font-size: 13px; color: var(--muted); line-height: 1.55; }
      .consent a { color: var(--mint-deep); text-underline-offset: 3px; }
      label.opt { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
      label.opt input { margin-top: 3px; accent-color: var(--mint-deep); width: 16px; height: 16px; }

      .status { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; }
      .status.ok   { background: #e8f8f1; color: #07603f; border: 1px solid #b8e8d3; }
      .status.err  { background: #fdeceb; color: #8f2119; border: 1px solid #f6c9c5; }
      .status.info { background: #f2f5f1; color: var(--ink-2); border: 1px solid var(--line); }
      .status[hidden] { display: none; }

      .foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--faint); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .foot a { color: var(--muted); text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark"><svg class="bm-mark" viewBox="0 0 64 64" width="34" height="34" aria-hidden="true" focusable="false"><defs><linearGradient id="bmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CF6C8"/><stop offset="1" stop-color="#10B981"/></linearGradient></defs><circle cx="32" cy="32" r="32" fill="url(#bmg)"/><path class="bm-mark-m" pathLength="100" d="M18 44V20l14 12 14-12v24" stroke="#0B1F1A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg> Brand Mint</div>

      <h1 id="title">Continue with Google</h1>
      <p class="sub" id="subtitle">
        That's the whole sign-up. We get your email, you get a portal, and we
        call you within one working day.
      </p>

      <div class="tier" id="tier" hidden>
        <div>
          <b id="tier-name"></b>
          <small id="tier-weeks"></small>
        </div>
        <span class="price" id="tier-price"></span>
      </div>

      <div class="status" id="status" hidden></div>

      <button class="btn" id="google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="google-label">Continue with Google</span>
      </button>

      <p class="consent">
        By continuing you accept our
        <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a> and
        <a href="/terms" target="_blank" rel="noopener">Terms</a>.
      </p>
      <label class="opt">
        <input type="checkbox" id="newsletter" checked />
        <span>Send me occasional notes on running an online store in India. No spam, unsubscribe any time.</span>
      </label>

      <div class="foot">
        <span>Brand Mint · Hyderabad</span>
        <a href="/">← Back to the site</a>
      </div>
    </main>

    <script type="module">
      import {
        getProfile,
        signInWithGoogle,
        recordSignup,
        cleanAuthParamsFromUrl,
        peekSession,
      } from "/auth/session.js?v=clean2";
      import { TIER_BY_ID, inr } from "/shared/tiers.js?v=clean5";

      const params = new URLSearchParams(location.search);
      const next = params.get("next");
      const tierId = params.get("tier");
      const tier = tierId ? TIER_BY_ID[tierId] : null;

      const statusEl = document.getElementById("status");
      const googleBtn = document.getElementById("google");
      const newsletter = document.getElementById("newsletter");

      function say(msg, kind = "info") {
        statusEl.textContent = msg;
        statusEl.className = "status " + kind;
        statusEl.hidden = false;
      }

      // Show which store they picked, so the sign-in feels like step one of
      // that choice rather than a generic login wall.
      if (tier) {
        document.getElementById("tier").hidden = false;
        document.getElementById("tier-name").textContent = tier.name;
        document.getElementById("tier-weeks").textContent = `Tier ${tier.tier} · ${tier.weeks}`;
        document.getElementById("tier-price").textContent = inr(tier.price);
        document.getElementById("title").textContent = "Almost there";
        document.getElementById("subtitle").textContent =
          "Sign in with Google and we'll call you within one working day to get started.";
        document.getElementById("google-label").textContent = `Continue with Google — ${tier.name}`;
      }

      if (params.get("denied")) {
        say("That account doesn't have access to the page you tried to open. Sign in with a different account.", "err");
      } else if (params.get("signedout")) {
        say("You've been signed out.", "ok");
      }

      function homeFor(profile) {
        return profile.role === "admin" ? "/admin" : "/portal";
      }

      // Already signed in? Skip the button.
      (async () => {
        cleanAuthParamsFromUrl();
        if (!peekSession()) return;
        document.getElementById("subtitle").textContent = "Checking your session…";
        try {
          const profile = await getProfile({ force: true });
          if (!profile) return;
          // A signed-in visitor picking a new tier still gets it recorded.
          if (tier) await recordSignup({ tier: tier.id, newsletter: newsletter.checked });
          location.replace(next && next.startsWith("/") ? next : homeFor(profile));
        } catch (e) {
          console.error("[login] session check", e);
        }
      })();

      googleBtn.addEventListener("click", async () => {
        googleBtn.disabled = true;
        say("Opening Google…", "info");
        try {
          await signInWithGoogle(next && next.startsWith("/") ? next : "/portal");
          const profile = await getProfile({ force: true });
          if (!profile) throw new Error("Signed in, but we couldn't load your profile.");

          // Consent is implied by the button per the line above it; the
          // newsletter is the one genuinely optional thing, so it's a tick.
          await recordSignup({ tier: tier?.id || null, newsletter: newsletter.checked });

          location.replace(next && next.startsWith("/") ? next : homeFor(profile));
        } catch (e) {
          googleBtn.disabled = false;
          if (e?.code === "auth/popup-closed-by-user") return say("Sign-in cancelled.", "info");
          say(
            e?.code === "auth/operation-not-allowed"
              ? "Google sign-in isn't switched on for this project yet."
              : e?.message || "Could not sign in.",
            "err"
          );
        }
      });
    </script>
  </body>
</html>
