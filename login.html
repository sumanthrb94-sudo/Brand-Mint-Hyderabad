<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f1a" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Sign in — Brand Mint</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0b1f1a;
        --ink-2: #294a40;
        --muted: #5d7368;
        --line: #d8e0d4;
        --mint: #10b981;
        --mint-4: #047857;
        --paper: #fbfaf2;
        --display: "Plus Jakarta Sans", system-ui, sans-serif;
        --sans: "Inter", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        font-family: var(--sans);
        color: var(--ink);
        background:
          radial-gradient(900px 600px at 15% -10%, rgba(16, 185, 129, 0.16), transparent 60%),
          radial-gradient(700px 500px at 100% 110%, rgba(201, 169, 97, 0.12), transparent 60%),
          #f5f7f4;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 40px 34px 32px;
        box-shadow: 0 30px 80px rgba(11, 31, 26, 0.12);
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--display);
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: 18px;
        margin-bottom: 26px;
      }
      .mark span.dot {
        width: 28px; height: 28px; border-radius: 9px;
        background: linear-gradient(140deg, var(--mint), var(--mint-4));
        display: grid; place-items: center;
        color: #fff; font-size: 15px;
      }
      h1 {
        font-family: var(--display);
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: -0.025em;
        margin: 0 0 8px;
      }
      p.sub { margin: 0 0 26px; color: var(--muted); font-size: 14.5px; line-height: 1.55; }
      .btn {
        width: 100%;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 13px 18px;
        border-radius: 13px;
        font: 600 15px/1 var(--sans);
        cursor: pointer;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        transition: border-color .15s, box-shadow .15s, transform .08s;
      }
      .btn:hover { border-color: #b9c8b8; box-shadow: 0 6px 20px rgba(11,31,26,.08); }
      .btn:active { transform: translateY(1px); }
      .btn[disabled] { opacity: .55; cursor: not-allowed; }
      .btn-primary {
        background: linear-gradient(140deg, var(--mint), var(--mint-4));
        border-color: transparent; color: #fff;
      }
      .sep {
        display: flex; align-items: center; gap: 12px;
        margin: 22px 0; color: var(--muted); font-size: 12px;
        text-transform: uppercase; letter-spacing: .12em;
      }
      .sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; }
      input[type="email"] {
        width: 100%; padding: 12px 14px; border-radius: 12px;
        border: 1px solid var(--line); font: 15px var(--sans); color: var(--ink);
        background: #fcfdfc; margin-bottom: 12px;
      }
      input[type="email"]:focus {
        outline: none; border-color: var(--mint);
        box-shadow: 0 0 0 3px rgba(16,185,129,.16);
      }
      .note {
        margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line);
        font-size: 13px; color: var(--muted); line-height: 1.6;
      }
      .status {
        margin-top: 16px; padding: 12px 14px; border-radius: 12px;
        font-size: 13.5px; line-height: 1.5;
      }
      .status.ok   { background: #e8f8f1; color: #07603f; border: 1px solid #b8e8d3; }
      .status.err  { background: #fdeceb; color: #8f2119; border: 1px solid #f6c9c5; }
      .status.info { background: #f2f5f1; color: var(--ink-2); border: 1px solid var(--line); }
      .status[hidden] { display: none; }
      a { color: var(--mint-4); }
      .spinner {
        width: 15px; height: 15px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
        animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark"><span class="dot">◆</span> Brand Mint</div>

      <h1 id="title">Sign in</h1>
      <p class="sub" id="subtitle">
        Use the Google account your invite was sent to. We'll take you to the
        right place automatically.
      </p>

      <div class="status" id="status" hidden></div>

      <button class="btn" id="google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <div class="sep">or</div>

      <form id="magic" novalidate>
        <label for="email">Email a sign-in link</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="you@company.com"
          required
        />
        <button class="btn btn-primary" id="magic-btn" type="submit">Send me a link</button>
      </form>

      <p class="note" id="note">
        Access is by invitation. If your studio contact hasn't added your email
        yet, sign-in will succeed but the portal will stay empty until they do.
      </p>
    </main>

    <script type="module">
      import {
        getProfile,
        signInWithGoogle,
        signInWithEmail,
        cleanAuthParamsFromUrl,
        peekSession,
      } from "/auth/session.js?v=1";

      const params = new URLSearchParams(location.search);
      const next = params.get("next");
      const statusEl = document.getElementById("status");
      const googleBtn = document.getElementById("google");
      const magicForm = document.getElementById("magic");
      const magicBtn = document.getElementById("magic-btn");

      function say(msg, kind = "info") {
        statusEl.textContent = msg;
        statusEl.className = "status " + kind;
        statusEl.hidden = false;
      }

      // Contextual messages when we bounced someone here.
      if (params.get("denied")) {
        say(
          "That account doesn't have access to the page you tried to open. " +
            "Sign in with a different account, or ask Brand Mint to grant access.",
          "err"
        );
      } else if (params.get("pending")) {
        say(
          "You're signed in, but no client workspace is linked to this email yet. " +
            "Brand Mint has been notified — you'll get in as soon as they add you.",
          "info"
        );
      } else if (params.get("signedout")) {
        say("You've been signed out.", "ok");
      }

      /** Where does this user belong? */
      function homeFor(profile) {
        if (profile.role === "admin") return "/admin.html";
        return "/portal.html";
      }

      // If a session already exists, skip the form entirely.
      (async () => {
        cleanAuthParamsFromUrl();
        if (!peekSession()) return;
        document.getElementById("subtitle").textContent = "Checking your session…";
        try {
          const profile = await getProfile({ force: true });
          if (!profile) return;
          if (next && next.startsWith("/")) {
            location.replace(next);
          } else {
            location.replace(homeFor(profile));
          }
        } catch (e) {
          console.error("[login] session check", e);
        }
      })();

      googleBtn.addEventListener("click", async () => {
        googleBtn.disabled = true;
        say("Redirecting to Google…", "info");
        try {
          await signInWithGoogle(next && next.startsWith("/") ? next : "/login");
        } catch (e) {
          googleBtn.disabled = false;
          say(
            e?.message?.includes("provider is not enabled")
              ? "Google sign-in isn't switched on for this project yet. Use the email link below."
              : e?.message || "Could not start Google sign-in.",
            "err"
          );
        }
      });

      magicForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        if (!email || !email.includes("@")) return say("Enter a valid email address.", "err");
        magicBtn.disabled = true;
        magicBtn.textContent = "Sending…";
        try {
          await signInWithEmail(email, next && next.startsWith("/") ? next : "/login");
          say(`Check ${email} — we've sent a one-tap sign-in link. It expires in an hour.`, "ok");
          magicBtn.textContent = "Link sent";
        } catch (err) {
          magicBtn.disabled = false;
          magicBtn.textContent = "Send me a link";
          say(err?.message || "Could not send the link. Try again in a moment.", "err");
        }
      });
    </script>
  </body>
</html>
